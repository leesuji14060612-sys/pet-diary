<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 애 그림일기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#DCE6F2; --paper:#FFFFFF; --ink:#23407F; --pencil:#4A4A4A;
  --grid:#9DB3D9; --stamp:#E0483E; --marker:#FFE45C; --muted:#6B7A99;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#1B2233; --paper:#F3F1EA; --ink:#23407F; --pencil:#3D3D3D;
    --grid:#9DB3D9; --muted:#AEB9D1;
  }
}
:root[data-theme="dark"]{
  --desk:#1B2233; --paper:#F3F1EA; --ink:#23407F; --pencil:#3D3D3D;
  --grid:#9DB3D9; --muted:#AEB9D1;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--desk); color:var(--pencil);
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.6;
}
main{max-width:520px;margin:0 auto;padding:28px 16px 48px}
h1{
  font-family:"Gaegu","Apple SD Gothic Neo",cursive; font-weight:700;
  font-size:2.6rem; line-height:1.1; margin:0 0 6px; color:var(--ink);
}
.lede{margin:0 0 24px;color:var(--muted);font-size:.95rem}
.sheet{
  background:var(--paper); border-radius:6px; padding:18px;
  box-shadow:0 1px 0 var(--grid), 0 8px 24px rgba(35,64,127,.12);
}
label{display:block;font-size:.85rem;color:#4A4A4A;margin:14px 0 6px}
input[type=text],textarea,select{
  width:100%; font:inherit; font-size:1rem; color:#2A2A2A;
  border:1.5px solid var(--grid); border-radius:4px; padding:10px 12px; background:#fff;
}
textarea{min-height:64px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,#photo:focus-visible + .drop{
  outline:3px solid var(--marker); outline-offset:2px;
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:2px dashed var(--grid); border-radius:6px; min-height:180px; cursor:pointer;
  color:var(--ink); text-align:center; padding:12px; position:relative; overflow:hidden; background:#F7FAFF;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.drop{margin:0}
.drop img{max-width:100%;max-height:260px;border-radius:4px;display:block}
.drop .hint{font-family:"Gaegu",cursive;font-size:1.4rem}
button.primary{
  margin-top:18px; width:100%; font:inherit; font-family:"Gaegu",cursive; font-weight:700;
  font-size:1.5rem; padding:12px; border:0; border-radius:6px;
  background:var(--ink); color:#fff; cursor:pointer;
}
button.primary:disabled{opacity:.5;cursor:wait}
.note{font-size:.85rem;color:var(--stamp);margin:10px 0 0;min-height:1.2em}

/* 그림일기 page */
.diary{margin-top:28px;display:none}
.diary.show{display:block}
.meta{
  display:grid;grid-template-columns:1fr auto;border:2px solid var(--ink);border-bottom:0;
  font-family:"Gaegu",cursive;font-size:1.25rem;color:var(--ink);
}
.meta div{padding:6px 10px}
.meta div+div{border-left:2px solid var(--ink)}
.picture{border:2px solid var(--ink);border-bottom:0;background:#fff;padding:10px;display:flex;justify-content:center}
.picture{position:relative;min-height:200px;align-items:center}
.picture img{max-width:100%;max-height:360px;border-radius:2px}
.picture.pending img{filter:grayscale(1) blur(2px);opacity:.35}
.picture .drawing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"Gaegu",cursive;font-size:1.4rem;color:var(--ink);text-align:center;padding:12px}
.title{
  border:2px solid var(--ink);border-bottom:0;padding:6px 10px;
  font-family:"Gaegu",cursive;font-weight:700;font-size:1.4rem;color:var(--ink);
}
.wongoji{
  display:grid;grid-template-columns:repeat(10,1fr);
  border-top:2px solid var(--ink);border-left:2px solid var(--ink);
}
.wongoji span{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);
  font-family:"Gaegu",cursive;font-size:clamp(1.05rem,4.6vw,1.45rem);color:#2A2A2A;background:#fff;
}
.wongoji span:nth-child(10n){border-right:2px solid var(--ink)}
.wongoji span.last{border-bottom:2px solid var(--ink)}
.stampwrap{position:relative}
.stamp{
  position:absolute;right:-6px;bottom:-18px;width:96px;height:96px;border-radius:50%;
  border:3px solid var(--stamp);color:var(--stamp);display:flex;align-items:center;justify-content:center;
  text-align:center;font-family:"Gaegu",cursive;font-weight:700;font-size:1.15rem;line-height:1.1;
  transform:rotate(-14deg) scale(0);opacity:0;background:rgba(255,255,255,.55);pointer-events:none;
}
.stamp.on{animation:thunk .35s .25s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes thunk{to{transform:rotate(-14deg) scale(1);opacity:.9}}
@media (prefers-reduced-motion: reduce){.stamp.on{animation:none;transform:rotate(-14deg);opacity:.9}}
.thinking{font-family:"Gaegu",cursive;font-size:1.4rem;color:var(--ink);padding:18px 4px}

.page{background:#fff;padding:14px 14px 10px}
.shotbox{position:fixed;inset:0;z-index:50;background:rgba(15,20,35,.75);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.shotinner{background:#fff;border-radius:10px;padding:14px;max-width:480px;width:100%;max-height:100%;overflow:auto;text-align:center}
.shotinner img{max-width:100%;display:block;margin:0 auto;border:1px solid #DCE6F2;-webkit-touch-callout:default;user-select:auto}
.shottip{margin:0 0 10px;color:#23407F;font-size:1rem}
.shotbtns{display:flex;gap:8px;margin-top:12px}
.shotbtns button{flex:1;font:inherit;font-size:.9rem;padding:10px;border-radius:6px;border:1.5px solid #23407F;background:#fff;color:#23407F;cursor:pointer}
.sign{text-align:right;margin-top:26px;font-family:"Gaegu",cursive;font-size:1rem;color:#6B7A99}
.page.capturing .stamp{animation:none;transform:rotate(-14deg);opacity:.9}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.actions button{flex:1 1 40%}
.actions .main,.actions .artbtn{flex:1 1 100%;text-align:center;font-weight:700;padding:12px;border-radius:6px;cursor:pointer}
.actions .main{background:var(--ink);color:#fff;border:0}
.actions .artbtn{background:var(--marker);color:#23407F;font-size:1rem}
#artFile:focus-visible + .artbtn{outline:3px solid var(--ink);outline-offset:2px}
.actions button{
  flex:1;font:inherit;font-size:.95rem;padding:10px;border-radius:6px;cursor:pointer;
  border:1.5px solid var(--ink);background:transparent;color:var(--ink);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .actions button{color:#C9D6F2;border-color:#C9D6F2}}
:root[data-theme="dark"] .actions button{color:#C9D6F2;border-color:#C9D6F2}

.history{margin-top:40px}
.history h2{font-family:"Gaegu",cursive;font-size:1.6rem;color:var(--ink);margin:0 0 10px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .history h2,:root:not([data-theme="light"]) h1{color:#C9D6F2}}
:root[data-theme="dark"] .history h2,:root[data-theme="dark"] h1{color:#C9D6F2}
.hlist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hlist button{
  border:0;padding:0;background:var(--paper);border-radius:4px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;
}
.hlist img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.hlist small{display:block;padding:4px 6px;font-size:.75rem;color:#4A4A4A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>우리 애 그림일기</h1>
  <p class="lede">사진 한 장 올리면, 우리 애가 직접 쓴 오늘의 일기를 받아볼 수 있어요.</p>

  <section class="sheet" aria-label="일기 쓰기">
    <input type="file" id="photo" accept="image/*" class="sr">
    <label for="photo" class="drop" id="drop">
      <span class="hint" id="hint">여기를 눌러 오늘 사진 고르기</span>
    </label>

    <div class="row">
      <div>
        <label for="name">이름</label>
        <input type="text" id="name" placeholder="매실이" maxlength="12">
      </div>
      <div>
        <label for="kind">종류</label>
        <select id="kind">
          <option>고양이</option><option>강아지</option><option>토끼</option><option>햄스터</option><option>새</option><option>기타</option>
        </select>
      </div>
    </div>

    <label for="persona">성격 한 줄 (선택)</label>
    <input type="text" id="persona" placeholder="예: 겁 많은데 간식 앞에선 용감함" maxlength="60">

    <label for="today">오늘 있었던 일 (선택)</label>
    <textarea id="today" placeholder="예: 병원 다녀옴, 새 장난감 받음" maxlength="200"></textarea>

    <button class="primary" id="go">일기 써 달라고 하기</button>
    <p class="note" id="note" role="status"></p>
  </section>

  <section class="diary" id="diary" aria-live="polite"></section>

  <section class="history">
    <h2>지난 일기</h2>
    <div class="hlist" id="hlist"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const KEY = "petdiary:v1";
const WEATHER = {"맑음":"☀️ 맑음","흐림":"☁️ 흐림","비":"🌧️ 비","눈":"❄️ 눈","바람":"🍃 바람"};
let file = null, thumb = null;

const DAILY_LIMIT = 3;
function usedToday(){
  try { const u = JSON.parse(localStorage.getItem("petdiary:uses")||"{}"); return u.d === new Date().toDateString() ? u.n : 0; } catch { return 0; }
}
function markUse(){
  try { localStorage.setItem("petdiary:uses", JSON.stringify({d:new Date().toDateString(), n:usedToday()+1})); } catch {}
}
function blobToBase64(b){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(b); });
}

function loadAll(){ try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; } }
function saveAll(list){ try { localStorage.setItem(KEY, JSON.stringify(list.slice(0,12))); } catch {} }

function makeThumb(f){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const url = c.toDataURL("image/jpeg",0.8);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => res({url, blob:b}), "image/jpeg", 0.85);
    };
    img.onerror = () => res(null);
    img.src = URL.createObjectURL(f);
  });
}

$("#photo").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const t = await makeThumb(f);
  if (!t || !t.blob){
    file = null; thumb = null;
    $("#note").textContent = "이 사진 형식은 읽을 수 없어요. 갤러리에서 JPG 사진을 골라 주세요.";
    return;
  }
  file = t.blob; thumb = t.url;
  const drop = $("#drop");
  drop.querySelector("img")?.remove();
  $("#hint").hidden = true;
  if (thumb){ const im = new Image(); im.src = thumb; im.alt = "고른 사진"; drop.appendChild(im); }
  $("#note").textContent = "";
});

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`;
}

function wongoji(text){
  const cols = 10, cells = [];
  const paras = String(text).trim().split(/\n+/);
  paras.forEach(p => {
    const chars = Array.from(" " + p.trim());
    chars.forEach(ch => cells.push(ch));
    while (cells.length % cols) cells.push("");
  });
  while (cells.length < cols*6) cells.push("");
  const total = cells.length;
  return cells.map((c,i) => `<span class="${i >= total-cols ? "last":""}">${c === " " ? "" : escapeHtml(c)}</span>`).join("");
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render(entry, animate){
  const el = $("#diary");
  el.innerHTML = `
    <div class="page" id="page">
      <div class="meta"><div>${escapeHtml(entry.date)}</div><div>날씨: ${escapeHtml(WEATHER[entry.weather] || entry.weather || "☀️ 맑음")}</div></div>
      ${entry.img ? `<div class="picture ${entry.pending ? "pending" : ""}" id="pic"><img src="${entry.img}" alt="${escapeHtml(entry.name)} 그림">${entry.pending ? `<div class="drawing" data-skip>${escapeHtml(entry.name)} 모습을 크레파스로 그리는 중…<br>(30초쯤 걸려요)</div>` : ""}</div>` : ""}
      <div class="title">제목: ${escapeHtml(entry.title)}</div>
      <div class="stampwrap">
        <div class="wongoji">${wongoji(entry.diary)}</div>
        <div class="stamp on" aria-hidden="true">참<br>잘했어요</div>
      </div>
      <div class="sign">${escapeHtml(entry.name)}의 그림일기 · ${escapeHtml(location.host)}</div>
    </div>
    ${entry.drawErr ? `<p class="note">${escapeHtml(entry.drawErr)} 아래 '그림 넣기'로 직접 그림을 넣을 수도 있어요.</p>` : ""}
    <div class="actions">
      <button id="shot" class="main">일기장 이미지로 저장하기</button>
      <input type="file" id="artFile" accept="image/*" class="sr">
      <label for="artFile" class="artbtn">그림 넣기</label>
      ${entry.scene ? `<button id="copyArt">그림 문장 복사</button>` : ""}
      <button id="copy">글 복사하기</button>
      <button id="again">다시 써 달라고 하기</button>
    </div>`;
  el.classList.add("show");

  $("#copy").onclick = async () => {
    const t = `${entry.date} ${entry.name}의 일기\n제목: ${entry.title}\n\n${entry.diary}`;
    try { await navigator.clipboard.writeText(t); $("#copy").textContent = "복사했어요"; }
    catch { $("#copy").textContent = "복사가 막혀 있어요"; }
  };
  const ca = $("#copyArt");
  if (ca) ca.onclick = async () => {
    try { await navigator.clipboard.writeText(artPrompt(entry)); ca.textContent = "복사했어요"; }
    catch { ca.textContent = "복사가 막혀 있어요"; }
  };
  $("#artFile").onchange = async ev => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const t = await makeThumb(f);
    if (!t) return;
    entry.img = t.url; entry.pending = false; delete entry.drawErr;
    const list = loadAll();
    const i = list.findIndex(x => x.id && x.id === entry.id);
    if (i >= 0) { list[i].img = await shrink(t.url, 640); saveAll(list); }
    render(entry, false); renderHistory();
  };
  $("#again").onclick = () => write();
  $("#shot").onclick = () => savePage(entry);
  el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}

function cellsOf(text, cols){
  const cells = [];
  String(text).trim().split(/\n+/).forEach(p => {
    Array.from(" " + p.trim()).forEach(ch => cells.push(ch));
    while (cells.length % cols) cells.push("");
  });
  while (cells.length < cols*6) cells.push("");
  return cells;
}
function loadImg(src){
  return new Promise(res => { if (!src) return res(null); const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
}

// 일기장 한 장을 캔버스에 직접 그립니다 (외부 라이브러리 없이 가볍게)
async function drawDiaryCanvas(entry){
  const W = 1080, PAD = 60, IW = W - PAD*2, COLS = 10, CELL = IW / COLS;
  const INK = "#23407F", GRID = "#9DB3D9", RED = "#E0483E", TEXT = "#2A2A2A";
  const HAND = '"Gaegu", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  try { await Promise.all([document.fonts.load(`700 40px Gaegu`), document.fonts.load(`400 40px Gaegu`)]); } catch {}
  const img = await loadImg(entry.img);
  const cells = cellsOf(entry.diary, COLS);
  const rows = cells.length / COLS;

  const META_H = 96, TITLE_H = 96;
  let picH = 0, dw = 0, dh = 0;
  if (img){
    const k = Math.min((IW - 40) / img.width, 760 / img.height);
    dw = img.width * k; dh = img.height * k; picH = dh + 40;
  }
  const gridH = rows * CELL;
  const H = PAD + META_H + picH + TITLE_H + gridH + 110;

  const c = document.createElement("canvas");
  c.width = W; c.height = Math.round(H);
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  g.textBaseline = "middle";
  let y = PAD;

  // 날짜 / 날씨
  const WX = W - PAD - 320;
  g.strokeStyle = INK; g.lineWidth = 4;
  g.strokeRect(PAD, y, IW, META_H);
  g.beginPath(); g.moveTo(WX, y); g.lineTo(WX, y + META_H); g.stroke();
  g.fillStyle = INK; g.font = `400 44px ${HAND}`; g.textAlign = "left";
  g.fillText(entry.date, PAD + 22, y + META_H/2 + 2);
  g.fillText("날씨: " + (WEATHER[entry.weather] || entry.weather || "☀️ 맑음"), WX + 22, y + META_H/2 + 2);
  y += META_H;

  // 그림
  if (img){
    g.strokeRect(PAD, y, IW, picH);
    g.drawImage(img, PAD + (IW - dw)/2, y + 20, dw, dh);
    y += picH;
  }

  // 제목
  g.strokeRect(PAD, y, IW, TITLE_H);
  g.font = `700 50px ${HAND}`; g.fillStyle = INK;
  g.fillText("제목: " + entry.title, PAD + 22, y + TITLE_H/2 + 2);
  y += TITLE_H;

  // 원고지
  const gy = y;
  g.lineWidth = 2; g.strokeStyle = GRID;
  for (let r = 1; r < rows; r++){ g.beginPath(); g.moveTo(PAD, gy + r*CELL); g.lineTo(PAD + IW, gy + r*CELL); g.stroke(); }
  for (let k = 1; k < COLS; k++){ g.beginPath(); g.moveTo(PAD + k*CELL, gy); g.lineTo(PAD + k*CELL, gy + gridH); g.stroke(); }
  g.lineWidth = 4; g.strokeStyle = INK; g.strokeRect(PAD, gy, IW, gridH);
  g.fillStyle = TEXT; g.font = `400 60px ${HAND}`; g.textAlign = "center";
  cells.forEach((ch, i) => {
    if (!ch || ch === " ") return;
    const cx = PAD + (i % COLS) * CELL + CELL/2, cy = gy + Math.floor(i / COLS) * CELL + CELL/2 + 3;
    g.fillText(ch, cx, cy);
  });
  y += gridH;

  // 참 잘했어요 도장
  g.save();
  g.translate(W - PAD - 70, y - 20);
  g.rotate(-14 * Math.PI / 180);
  g.globalAlpha = 0.9;
  g.fillStyle = "rgba(255,255,255,.6)";
  g.beginPath(); g.arc(0, 0, 105, 0, Math.PI*2); g.fill();
  g.strokeStyle = RED; g.lineWidth = 7;
  g.beginPath(); g.arc(0, 0, 105, 0, Math.PI*2); g.stroke();
  g.fillStyle = RED; g.font = `700 56px ${HAND}`; g.textAlign = "center";
  g.fillText("참", 0, -28); g.fillText("잘했어요", 0, 34);
  g.restore();

  // 서명
  g.globalAlpha = 1;
  g.fillStyle = "#6B7A99"; g.font = `400 36px ${HAND}`; g.textAlign = "left";
  g.fillText(`${entry.name}의 그림일기 · ${location.host}`, PAD, y + 70);
  return c;
}

async function savePage(entry){
  const btn = $("#shot");
  if (entry.pending){ btn.textContent = "그림이 다 그려지면 저장할 수 있어요"; return; }
  btn.disabled = true; btn.textContent = "이미지 만드는 중…";
  try {
    const canvas = await drawDiaryCanvas(entry);
    const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.9));
    if (!blob) throw new Error("no blob");
    showShot(blob, entry);
    btn.textContent = "일기장 이미지로 저장하기";
  } catch (e) {
    console.error(e);
    btn.textContent = "저장이 안 됐어요. 화면을 캡처해 주세요";
  } finally {
    btn.disabled = false;
  }
}

function showShot(blob, entry){
  const dataUrl = URL.createObjectURL(blob);
  const fname = `petdiary-${new Date().toISOString().slice(0,10)}.jpg`;
  const box = document.createElement("div");
  box.className = "shotbox";
  box.innerHTML = `
    <div class="shotinner" role="dialog" aria-label="일기장 이미지">
      <p class="shottip">아래 이미지를 <b>꾹 눌러서</b><br>'이미지 저장'을 골라 주세요</p>
      <img src="${dataUrl}" alt="${escapeHtml(entry.name)}의 그림일기">
      <div class="shotbtns">
        <button id="shotShare">공유하기</button>
        <button id="shotDl">파일로 받기</button>
        <button id="shotClose">닫기</button>
      </div>
    </div>`;
  document.body.appendChild(box);
  document.body.style.overflow = "hidden";
  const close = () => { box.remove(); document.body.style.overflow = ""; URL.revokeObjectURL(dataUrl); };
  box.querySelector("#shotClose").onclick = close;
  box.addEventListener("click", e => { if (e.target === box) close(); });
  box.querySelector("#shotDl").onclick = () => {
    const a = document.createElement("a"); a.href = dataUrl; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
  };
  const sh = box.querySelector("#shotShare");
  sh.onclick = async () => {
    try {
      const file = new File([blob], fname, { type: "image/jpeg" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
      } else {
        sh.textContent = "이 브라우저는 공유가 안 돼요";
      }
    } catch (e) {
      if (!e || e.name !== "AbortError") sh.textContent = "공유가 안 돼요. 꾹 눌러 저장해 주세요";
    }
  };
}

function artPrompt(e){
  const animal = {"고양이":"cat","강아지":"dog","토끼":"rabbit","햄스터":"hamster","새":"bird"}[e.kind] || "pet";
  return `Redraw the ${animal} in the attached photo as a cute crayon drawing, like a picture a Korean elementary school kid draws in a picture diary.
Keep the ${animal} recognizable: same fur colors, markings and body shape as in the photo.
Draw ONLY this scene, and nothing else: ${e.scene}
Do not add any people, animals, objects or props that are not in that scene. Ignore the photo's background.
No text, letters, numbers, labels or speech bubbles anywhere in the image.
Style: wax crayon and colored pencil on white paper, simple slightly wobbly lines, soft pastel colors, plain white background. Square image.`;
}

function renderHistory(){
  const list = loadAll(), box = $("#hlist");
  if (!list.length){ box.innerHTML = `<p class="empty">아직 쓴 일기가 없어요. 첫 사진을 올려 보세요.</p>`; box.style.display="block"; return; }
  box.style.display = "";
  box.innerHTML = list.map((e,i) => `<button data-i="${i}">${e.img ? `<img src="${e.img}" alt="">` : ""}<small>${escapeHtml(e.title)}</small></button>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => render(loadAll()[+b.dataset.i], false));
}

const ERR = {
  not_granted:"Claude 사용을 허락해야 일기를 쓸 수 있어요.",
  rate_limited:"요청이 많아요. 잠시 후 다시 눌러 주세요.",
  image_rejected:"이 사진은 읽을 수 없어요. 다른 사진(JPG·PNG)을 골라 주세요.",
  images_unavailable:"이 화면에서는 사진을 보낼 수 없어요.",
  refused:"이 사진으로는 일기를 쓸 수 없어요. 다른 사진을 골라 주세요.",
  invalid_json:"일기가 이상하게 써졌어요. 한 번 더 눌러 주세요.",
  session_expired:"다시 로그인해 주세요."
};

async function write(){
  if (!file){ $("#note").textContent = "먼저 사진을 골라 주세요."; return; }
  if (usedToday() >= DAILY_LIMIT){ $("#note").textContent = `오늘은 ${DAILY_LIMIT}번까지 쓸 수 있어요. 내일 또 만나요!`; return; }
  const name = $("#name").value.trim() || "우리 애";
  const kind = $("#kind").value;
  const persona = $("#persona").value.trim();
  const today = $("#today").value.trim();
  $("#note").textContent = "";
  $("#go").disabled = true;
  const el = $("#diary");
  el.classList.add("show");
  el.innerHTML = `<p class="thinking">${escapeHtml(name)}(이)가 연필 깎는 중…</p>`;
  try {
    const image = await blobToBase64(file);
    const resp = await fetch("/api/diary", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ image, name, kind, persona, today })
    });
    const r = await resp.json().catch(() => ({}));
    if (!resp.ok || typeof r.diary !== "string") throw new Error(r.error || "fail");
    markUse();
    const entry = {
      id: Date.now(), kind,
      date: todayStr(), name, weather: String(r.weather || "맑음"),
      title: String(r.title || `${name}의 하루`).slice(0,20),
      diary: r.diary.slice(0,260), img: thumb, scene: String(r.scene || "")
    };
    entry.pending = true;
    render(entry, true);
    drawPicture(entry, image);
  } catch (e) {
    el.classList.remove("show"); el.innerHTML = "";
    $("#note").textContent = (e && e.message && e.message !== "fail" && e.message.length < 80) ? e.message : "일기를 쓰다 멈췄어요. 한 번 더 눌러 주세요.";
  } finally {
    $("#go").disabled = false;
  }
}

function shrink(dataUrl, max){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.8));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

async function drawPicture(entry, image){
  try {
    const resp = await fetch("/api/drawing", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ image, name: entry.name, kind: $("#kind").value, title: entry.title, diary: entry.diary, scene: entry.scene })
    });
    const r = await resp.json().catch(() => ({}));
    if (!resp.ok || !r.image) throw new Error(r.error || "그림을 그리다 멈췄어요.");
    entry.img = r.image; entry.drawn = true;
  } catch (e) {
    entry.drawErr = (e && e.message) || "그림을 그리다 멈췄어요.";
  }
  entry.pending = false;
  render(entry, false);
  delete entry.drawErr;
  const saved = Object.assign({}, entry, { img: entry.img ? await shrink(entry.img, 640) : null });
  const list = loadAll(); list.unshift(saved); saveAll(list);
  renderHistory();
}

$("#go").addEventListener("click", () => write());
renderHistory();
</script>
