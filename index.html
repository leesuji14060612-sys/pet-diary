<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 애 그림일기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#DCE6F2; --paper:#FFFFFF; --ink:#23407F; --pencil:#4A4A4A;
  --grid:#9DB3D9; --stamp:#E0483E; --marker:#FFE45C; --muted:#6B7A99;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#1B2233; --paper:#F3F1EA; --ink:#23407F; --pencil:#3D3D3D;
    --grid:#9DB3D9; --muted:#AEB9D1;
  }
}
:root[data-theme="dark"]{
  --desk:#1B2233; --paper:#F3F1EA; --ink:#23407F; --pencil:#3D3D3D;
  --grid:#9DB3D9; --muted:#AEB9D1;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--desk); color:var(--pencil);
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.6;
}
main{max-width:520px;margin:0 auto;padding:28px 16px 48px}
h1{
  font-family:"Gaegu","Apple SD Gothic Neo",cursive; font-weight:700;
  font-size:2.6rem; line-height:1.1; margin:0 0 6px; color:var(--ink);
}
.lede{margin:0 0 24px;color:var(--muted);font-size:.95rem}
.sheet{
  background:var(--paper); border-radius:6px; padding:18px;
  box-shadow:0 1px 0 var(--grid), 0 8px 24px rgba(35,64,127,.12);
}
label{display:block;font-size:.85rem;color:#4A4A4A;margin:14px 0 6px}
input[type=text],textarea,select{
  width:100%; font:inherit; font-size:1rem; color:#2A2A2A;
  border:1.5px solid var(--grid); border-radius:4px; padding:10px 12px; background:#fff;
}
textarea{min-height:64px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,#photo:focus-visible + .drop{
  outline:3px solid var(--marker); outline-offset:2px;
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:2px dashed var(--grid); border-radius:6px; min-height:180px; cursor:pointer;
  color:var(--ink); text-align:center; padding:12px; position:relative; overflow:hidden; background:#F7FAFF;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.drop{margin:0}
.drop img{max-width:100%;max-height:260px;border-radius:4px;display:block}
.drop .hint{font-family:"Gaegu",cursive;font-size:1.4rem}
button.primary{
  margin-top:18px; width:100%; font:inherit; font-family:"Gaegu",cursive; font-weight:700;
  font-size:1.5rem; padding:12px; border:0; border-radius:6px;
  background:var(--ink); color:#fff; cursor:pointer;
}
button.primary:disabled{opacity:.5;cursor:wait}
.note{font-size:.85rem;color:var(--stamp);margin:10px 0 0;min-height:1.2em}

/* 그림일기 page */
.diary{margin-top:28px;display:none}
.diary.show{display:block}
.meta{
  display:grid;grid-template-columns:1fr auto;border:2px solid var(--ink);border-bottom:0;
  font-family:"Gaegu",cursive;font-size:1.25rem;color:var(--ink);
}
.meta div{padding:6px 10px}
.meta div+div{border-left:2px solid var(--ink)}
.picture{border:2px solid var(--ink);border-bottom:0;background:#fff;padding:10px;display:flex;justify-content:center}
.picture{position:relative;min-height:200px;align-items:center}
.picture img{max-width:100%;max-height:360px;border-radius:2px}
.picture.pending img{filter:grayscale(1) blur(2px);opacity:.35}
.picture .drawing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"Gaegu",cursive;font-size:1.4rem;color:var(--ink);text-align:center;padding:12px}
.title{
  border:2px solid var(--ink);border-bottom:0;padding:6px 10px;
  font-family:"Gaegu",cursive;font-weight:700;font-size:1.4rem;color:var(--ink);
}
.wongoji{
  display:grid;grid-template-columns:repeat(10,1fr);
  border-top:2px solid var(--ink);border-left:2px solid var(--ink);
}
.wongoji span{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);
  font-family:"Gaegu",cursive;font-size:clamp(1.05rem,4.6vw,1.45rem);color:#2A2A2A;background:#fff;
}
.wongoji span:nth-child(10n){border-right:2px solid var(--ink)}
.wongoji span.last{border-bottom:2px solid var(--ink)}
.stampwrap{position:relative}
.stamp{
  position:absolute;right:-6px;bottom:-18px;width:96px;height:96px;border-radius:50%;
  border:3px solid var(--stamp);color:var(--stamp);display:flex;align-items:center;justify-content:center;
  text-align:center;font-family:"Gaegu",cursive;font-weight:700;font-size:1.15rem;line-height:1.1;
  transform:rotate(-14deg) scale(0);opacity:0;background:rgba(255,255,255,.55);pointer-events:none;
}
.stamp.on{animation:thunk .35s .25s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes thunk{to{transform:rotate(-14deg) scale(1);opacity:.9}}
@media (prefers-reduced-motion: reduce){.stamp.on{animation:none;transform:rotate(-14deg);opacity:.9}}
.thinking{font-family:"Gaegu",cursive;font-size:1.4rem;color:var(--ink);padding:18px 4px}

.page{background:#fff;padding:14px 14px 10px}
.shotbox{position:fixed;inset:0;z-index:50;background:rgba(15,20,35,.75);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.shotinner{background:#fff;border-radius:10px;padding:14px;max-width:480px;width:100%;max-height:100%;overflow:auto;text-align:center}
.shotinner img{max-width:100%;display:block;margin:0 auto;border:1px solid #DCE6F2;-webkit-touch-callout:default;user-select:auto}
.shottip{margin:0 0 10px;color:#23407F;font-size:1rem}
.outbtn{margin-top:8px;font:inherit;font-weight:700;padding:10px 14px;border-radius:6px;border:0;background:#23407F;color:#fff;cursor:pointer}
.shotbtns{display:flex;gap:8px;margin-top:12px}
.shotbtns button{flex:1;font:inherit;font-size:.9rem;padding:10px;border-radius:6px;border:1.5px solid #23407F;background:#fff;color:#23407F;cursor:pointer}
.sign{text-align:right;margin-top:26px;font-family:"Gaegu",cursive;font-size:1rem;color:#6B7A99}
.page.capturing .stamp{animation:none;transform:rotate(-14deg);opacity:.9}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.actions button{flex:1 1 40%}
.actions .main,.actions .artbtn{flex:1 1 100%;text-align:center;font-weight:700;padding:12px;border-radius:6px;cursor:pointer}
.actions .main{background:var(--ink);color:#fff;border:0}
.actions .vidbtn{background:#E0607E}
.vidwrap{margin-top:12px;text-align:center}
.vidwrap video{max-width:100%;max-height:70vh;border-radius:10px;box-shadow:0 8px 24px rgba(35,64,127,.2);background:#000}
.actions .artbtn{background:var(--marker);color:#23407F;font-size:1rem}
#artFile:focus-visible + .artbtn{outline:3px solid var(--ink);outline-offset:2px}
.actions button{
  flex:1;font:inherit;font-size:.95rem;padding:10px;border-radius:6px;cursor:pointer;
  border:1.5px solid var(--ink);background:transparent;color:var(--ink);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .actions button{color:#C9D6F2;border-color:#C9D6F2}}
:root[data-theme="dark"] .actions button{color:#C9D6F2;border-color:#C9D6F2}

.history{margin-top:40px}
.history h2{font-family:"Gaegu",cursive;font-size:1.6rem;color:var(--ink);margin:0 0 10px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .history h2,:root:not([data-theme="light"]) h1{color:#C9D6F2}}
:root[data-theme="dark"] .history h2,:root[data-theme="dark"] h1{color:#C9D6F2}
.hlist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hlist button{
  border:0;padding:0;background:var(--paper);border-radius:4px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;
}
.hlist img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.hlist small{display:block;padding:4px 6px;font-size:.75rem;color:#4A4A4A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);font-size:.9rem}
.inapp{background:#FFF4C2;border:1.5px solid #E0A800;border-radius:8px;padding:10px 12px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.inapp[hidden]{display:none}
.inapp p{margin:0;flex:1;font-size:.9rem;color:#5A4500}
.inapp button{font:inherit;font-size:.9rem;font-weight:700;padding:9px 12px;border-radius:6px;border:0;background:#23407F;color:#fff;cursor:pointer;white-space:nowrap}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 16px}
.tabs button{font:inherit;font-size:.92rem;padding:11px 4px;border-radius:6px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs button{color:#C9D6F2;border-color:#C9D6F2}:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{background:#C9D6F2;color:#1B2233}}
:root[data-theme="dark"] .tabs button{color:#C9D6F2;border-color:#C9D6F2}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{background:#C9D6F2;color:#1B2233}
.tones{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tone{font:inherit;font-size:.9rem;padding:10px 2px;border-radius:6px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.tone.on{background:var(--ink);color:#fff}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:6px}
.mode{font:inherit;font-size:.9rem;padding:10px 4px;border-radius:6px;border:1.5px solid #C8321E;background:#fff;color:#C8321E;cursor:pointer}
.mode.on{background:#C8321E;color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:.88rem;color:#4A4A4A;margin-top:8px}
.check input{width:18px;height:18px}
input[type=date]{width:100%;font:inherit;font-size:1rem;border:1.5px solid var(--grid);border-radius:4px;padding:9px 12px;background:#fff;color:#2A2A2A}
.sajusheet .primary{background:#C8321E}
.facedrop{min-height:150px;margin-top:12px;border-color:#C8321E;background:#FFF8E0;color:#C8321E}
.facedrop img{max-height:220px}
.charmwrap{margin-top:24px;text-align:center}
.charmwrap img{max-width:100%;border-radius:4px;box-shadow:0 8px 24px rgba(120,40,20,.25)}
.facephoto{display:block;width:160px;height:160px;object-fit:cover;border-radius:50%;border:4px solid #C8321E;margin:10px auto 6px}

.bujeok{margin-top:24px;background:#FBEFC4;border:3px double #C8321E;border-radius:4px;padding:18px 16px 14px;color:#3A2A1A}
.bujeok .bhead{text-align:center;font-family:"Gowun Batang","Nanum Myeongjo",serif;color:#C8321E}
.bujeok .bhead small{display:block;font-size:.85rem;letter-spacing:.2em}
.bujeok .bhead b{display:block;font-size:1.6rem;margin:4px 0}
.score{text-align:center;font-family:"Gaegu",cursive;font-size:3rem;font-weight:700;color:#C8321E;line-height:1}
.score span{font-size:1.4rem}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 10px}
.pillars div{background:#fff8e0;border:1.5px solid #C8321E;border-radius:4px;text-align:center;padding:6px 2px}
.pillars small{display:block;font-size:.72rem;color:#8A5A3A}
.pillars b{display:block;font-family:"Gowun Batang",serif;font-size:1.5rem;line-height:1.25;color:#3A2A1A}
.pillars em{display:block;font-style:normal;font-size:.75rem;color:#8A5A3A}
.elbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:4px 0 4px;background:#eee}
.ellegend{display:flex;justify-content:space-between;font-size:.78rem;color:#5A4A3A;margin-bottom:12px}
.bsec{border-top:1px dashed #C8321E;padding:10px 0 2px}
.bsec h3{margin:0 0 4px;font-family:"Gowun Batang",serif;font-size:1rem;color:#C8321E}
.bsec p{margin:0;font-size:.95rem;line-height:1.65}
.disclaimer{text-align:center;font-size:.78rem;color:#8A5A3A;margin:12px 0 0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .who{text-align:center;font-family:"Gowun Batang",serif;font-size:.95rem;color:#C8321E;margin-top:6px}
.duo .pillars{grid-template-columns:repeat(3,1fr);gap:4px;margin:6px 0}
.duo .pillars b{font-size:1.15rem}
.tabs{grid-template-columns:1fr 1fr 1.3fr 1.1fr}
.xmodes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.xmode{font:inherit;font-size:.9rem;padding:10px 4px;border-radius:6px;border:1.5px solid #8E7CC3;background:#fff;color:#5B4A99;cursor:pointer}
.xmode.on{background:#8E7CC3;color:#fff}
.letterdrop{min-height:120px;margin-top:12px;border-color:#B9A9E6;background:#F7F4FF;color:#6A5AA8}
.letterdrop img{max-height:200px}
.caldrop{min-height:110px;margin-top:14px}
.letterbtn{background:#8E7CC3}
.thanksbtn{background:#E0607E}
.thanksdrop{border-color:#F3B2C1;background:#FFF3F6;color:#C2466A}
.sibbtn{background:#3A8F6B}
.sibdrop{border-color:#A8D5BF;background:#F1FAF5;color:#2F7A59}
.sibcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sibcols fieldset{border:1.5px solid #A8D5BF;border-radius:8px;padding:4px 10px 10px;margin:0;min-width:0}
.sibcols legend{color:#2F7A59;font-weight:700;padding:0 4px}
.xmodes .xmode{font-size:.85rem}
.calthumbs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.calthumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px}
.letterwrap{margin-top:24px;text-align:center}
.letterwrap img{max-width:100%;border-radius:6px;box-shadow:0 8px 24px rgba(90,70,150,.2)}
.calgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.calgrid button{border:0;padding:0;background:none;cursor:pointer;border-radius:4px;overflow:hidden;box-shadow:0 2px 8px rgba(35,64,127,.15)}
.calgrid img{width:100%;display:block}
.calgrid .cover{grid-column:1/-1}
[hidden]{display:none !important}
.shopintro{margin:0 0 6px;font-size:.92rem;color:#3E5B4A;line-height:1.6}
.shopdrop{min-height:100px;margin-top:14px;border-color:#9CCB9F;background:#F2FAF2;color:#2E7D46}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shopbtn{background:#2E7D46}
</style>
</head>
<body>
<main>
  <h1>우리 애 그림일기</h1>
  <p class="lede">사진 한 장으로 우리 애 그림일기, 생일 하나로 우리 애 사주까지.</p>
  <div class="inapp" id="inapp" hidden>
    <p>카톡·인스타 안에서는 이미지 저장이 안 돼요.</p>
    <button id="openOut">크롬으로 열기</button>
  </div>
  <nav class="tabs" role="tablist" aria-label="메뉴">
    <button role="tab" id="tabBtnDiary" aria-selected="true" aria-controls="tabDiary">📔 일기</button>
    <button role="tab" id="tabBtnSaju" aria-selected="false" aria-controls="tabSaju">🔮 사주</button>
    <button role="tab" id="tabBtnExtra" aria-selected="false" aria-controls="tabExtra">💌 편지·달력</button>
    <button role="tab" id="tabBtnShop" aria-selected="false" aria-controls="tabShop">🏫 알림장</button>
  </nav>
<div id="tabDiary" role="tabpanel">

  <section class="sheet" aria-label="일기 쓰기">
    <input type="file" id="photo" accept="image/*" class="sr">
    <label for="photo" class="drop" id="drop">
      <span class="hint" id="hint">여기를 눌러 오늘 사진 고르기</span>
    </label>

    <div class="row">
      <div>
        <label for="name">이름</label>
        <input type="text" id="name" placeholder="매실이" maxlength="12">
      </div>
      <div>
        <label for="kind">종류</label>
        <select id="kind">
          <option>고양이</option><option>강아지</option><option>토끼</option><option>햄스터</option><option>새</option><option>기타</option>
        </select>
      </div>
    </div>

    <label for="persona">성격 한 줄 (선택)</label>
    <input type="text" id="persona" placeholder="예: 겁 많은데 간식 앞에선 용감함" maxlength="60">

    <label id="toneLabel">일기 말투</label>
    <div class="tones" role="radiogroup" aria-labelledby="toneLabel">
      <button type="button" class="tone on" data-tone="기본" role="radio" aria-checked="true">🙂 기본</button>
      <button type="button" class="tone" data-tone="시크" role="radio" aria-checked="false">😎 시크</button>
      <button type="button" class="tone" data-tone="애교" role="radio" aria-checked="false">🥺 애교</button>
      <button type="button" class="tone" data-tone="허세" role="radio" aria-checked="false">👑 허세</button>
    </div>

    <label for="today">오늘 있었던 일 (선택)</label>
    <textarea id="today" placeholder="예: 병원 다녀옴, 새 장난감 받음" maxlength="200"></textarea>

    <button class="primary" id="go">일기 써 달라고 하기</button>
    <p class="note" id="note" role="status"></p>
  </section>

  <section class="diary" id="diary" aria-live="polite"></section>

  <section class="history">
    <h2>지난 일기</h2>
    <div class="hlist" id="hlist"></div>
  </section>
</div>
<div id="tabSaju" role="tabpanel" hidden>
  <section class="sheet sajusheet" aria-label="사주 보기">
    <div class="modes" role="radiogroup" aria-label="무엇을 볼까요">
      <button class="mode on" data-mode="pet" role="radio" aria-checked="true">우리 애 사주</button>
      <button class="mode" data-mode="match" role="radio" aria-checked="false">집사와 궁합</button>
      <button class="mode" data-mode="year" role="radio" aria-checked="false">올해 운세</button>
      <button class="mode" data-mode="face" role="radio" aria-checked="false">📸 관상 보기</button>
      <button class="mode" data-mode="charm" role="radio" aria-checked="false" style="grid-column:1/-1">🧧 우리 애 행운 부적</button>
    </div>

    <div class="row">
      <div>
        <label for="sName">이름</label>
        <input type="text" id="sName" placeholder="매실이" maxlength="12">
      </div>
      <div>
        <label for="sKind">종류</label>
        <select id="sKind">
          <option>고양이</option><option>강아지</option><option>토끼</option><option>햄스터</option><option>새</option><option>기타</option>
        </select>
      </div>
    </div>

    <div id="furBox" hidden>
      <label for="sFur">털 색 (부적 캐릭터에 들어가요)</label>
      <select id="sFur">
        <option>치즈</option><option>고등어</option><option>삼색</option><option>턱시도</option><option>검정</option><option>흰색</option><option>회색</option><option>갈색</option><option>크림</option>
      </select>
    </div>
    <div id="faceBox" hidden>
      <input type="file" id="fPhoto" accept="image/*" class="sr">
      <label for="fPhoto" class="drop facedrop" id="fDrop"><span class="hint" id="fHint">여기를 눌러 얼굴이 잘 보이는 사진 고르기</span></label>
    </div>
    <label for="sDate" id="sDateLabel">생일</label>
    <input type="date" id="sDate" min="1990-01-01">
    <label class="check"><input type="checkbox" id="sNoBday"> 생일을 몰라요 (집에 온 날로 볼게요)</label>

    <div id="ownerBox" hidden>
      <div class="row">
        <div>
          <label for="oName">집사 이름 (선택)</label>
          <input type="text" id="oName" placeholder="집사" maxlength="12">
        </div>
        <div>
          <label for="oDate">집사 생일</label>

<script>
// 캔버스에 그리기 전에, 실제로 쓸 글자가 들어 있는 폰트 조각을 모두 불러와요 (한글 깨짐 방지)
// 이름 뒤에 자연스러운 조사 붙이기: 매실이 → 매실이가, 콩 → 콩이가
function hasBatchim(word){ const ch = String(word).trim().slice(-1).charCodeAt(0); return ch >= 0xAC00 && ch <= 0xD7A3 && (ch - 0xAC00) % 28 !== 0; }
function ga(name){ return name + (hasBatchim(name) ? "이가" : "가"); }
// 그림 저장용 폰트는 사이트 안 /fonts 폴더의 "전체 글자" 폰트를 써요. (구글 폰트는 글자를 조각내서 불러와서 일부 글자가 다른 글씨체로 섞일 수 있어요)
const FONT_FILES = [
  ["PD Gaegu", "/fonts/Gaegu-Regular.woff2", "400"], ["PD Gaegu", "/fonts/Gaegu-Bold.woff2", "700"],
  ["PD Dodum", "/fonts/GowunDodum-Regular.woff2", "400"],
  ["PD Batang", "/fonts/GowunBatang-Regular.woff2", "400"], ["PD Batang", "/fonts/GowunBatang-Bold.woff2", "700"],
];
let fontsReady = null;
function ensureFonts(){
  if (!fontsReady){
    fontsReady = Promise.all(FONT_FILES.map(([fam, url, weight]) => {
      const f = new FontFace(fam, `url(${url}) format("woff2")`, { weight, style: "normal" });
      return f.load().then(ff => { document.fonts.add(ff); }).catch(err => console.warn("폰트 불러오기 실패", url, err));
    }));
  }
  return fontsReady;
}
const $ = s => document.querySelector(s);
const KEY = "petdiary:v1";
const WEATHER = {"맑음":"☀️ 맑음","흐림":"☁️ 흐림","비":"🌧️ 비","눈":"❄️ 눈","바람":"🍃 바람"};
let file = null, thumb = null;

const DAILY_LIMIT = Infinity; // 횟수 제한 없음 (혼자 쓰는 동안)
function usedToday(){
  try { const u = JSON.parse(localStorage.getItem("petdiary:uses")||"{}"); return u.d === new Date().toDateString() ? u.n : 0; } catch { return 0; }
}
function markUse(){
  try { localStorage.setItem("petdiary:uses", JSON.stringify({d:new Date().toDateString(), n:usedToday()+1})); } catch {}
}
function blobToBase64(b){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(b); });
}

function loadAll(){ try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; } }
function saveAll(list){ try { localStorage.setItem(KEY, JSON.stringify(list.slice(0,12))); } catch {} }

function makeThumb(f){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const url = c.toDataURL("image/jpeg",0.8);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => res({url, blob:b}), "image/jpeg", 0.85);
    };
    img.onerror = () => res(null);
    img.src = URL.createObjectURL(f);
  });
}

$("#photo").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const t = await makeThumb(f);
  if (!t || !t.blob){
    file = null; thumb = null;
    $("#note").textContent = "이 사진 형식은 읽을 수 없어요. 갤러리에서 JPG 사진을 골라 주세요.";
    return;
  }
  file = t.blob; thumb = t.url;
  const drop = $("#drop");
  drop.querySelector("img")?.remove();
  $("#hint").hidden = true;
  if (thumb){ const im = new Image(); im.src = thumb; im.alt = "고른 사진"; drop.appendChild(im); }
  $("#note").textContent = "";
});

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`;
}

function wongoji(text){
  const cols = 10, cells = [];
  const paras = String(text).trim().split(/\n+/);
  paras.forEach(p => {
    const chars = Array.from(" " + p.trim());
    chars.forEach(ch => cells.push(ch));
    while (cells.length % cols) cells.push("");
  });
  while (cells.length < cols*6) cells.push("");
  const total = cells.length;
  return cells.map((c,i) => `<span class="${i >= total-cols ? "last":""}">${c === " " ? "" : escapeHtml(c)}</span>`).join("");
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render(entry, animate){
  const el = $("#diary");
  el.innerHTML = `
    <div class="page" id="page">
      <div class="meta"><div>${escapeHtml(entry.date)}</div><div>날씨: ${escapeHtml(WEATHER[entry.weather] || entry.weather || "☀️ 맑음")}</div></div>
      ${entry.img ? `<div class="picture ${entry.pending ? "pending" : ""}" id="pic"><img src="${entry.img}" alt="${escapeHtml(entry.name)} 그림">${entry.pending ? `<div class="drawing" data-skip>${escapeHtml(entry.name)} 모습을 크레파스로 그리는 중…<br>(30초쯤 걸려요)</div>` : ""}</div>` : ""}
      <div class="title">제목: ${escapeHtml(entry.title)}</div>
      <div class="stampwrap">
        <div class="wongoji">${wongoji(entry.diary)}</div>
        <div class="stamp on" aria-hidden="true">참<br>잘했어요</div>
      </div>
      <div class="sign">${escapeHtml(entry.name)}의 그림일기</div>
    </div>
    ${entry.drawErr ? `<p class="note">${escapeHtml(entry.drawErr)} 아래 '그림 넣기'로 직접 그림을 넣을 수도 있어요.</p>` : ""}
    <div class="actions">
      <button id="shot" class="main">일기장 이미지로 저장하기</button>
      <button id="vid" class="main vidbtn">🎬 쇼츠 영상 만들기</button>
      <label class="check" style="flex:1 1 100%;margin:0"><input type="checkbox" id="vidMusic" checked> 잔잔한 오르골 배경음 넣기</label>
      <div id="vidOut" style="flex:1 1 100%"></div>
      <input type="file" id="artFile" accept="image/*" class="sr">
      <label for="artFile" class="artbtn">그림 넣기</label>
      ${entry.scene ? `<button id="copyArt">그림 문장 복사</button>` : ""}
      <button id="copy">글 복사하기</button>
      <button id="again">다시 써 달라고 하기</button>
    </div>`;
  el.classList.add("show");

  $("#copy").onclick = async () => {
    const t = `${entry.date} ${entry.name}의 일기\n제목: ${entry.title}\n\n${entry.diary}`;
    try { await navigator.clipboard.writeText(t); $("#copy").textContent = "복사했어요"; }
    catch { $("#copy").textContent = "복사가 막혀 있어요"; }
  };

    try { await navigator.clipboard.writeText(artPrompt(entry)); ca.textContent = "복사했어요"; }
    catch { ca.textContent = "복사가 막혀 있어요"; }
  };
  $("#artFile").onchange = async ev => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const t = await makeThumb(f);
    if (!t) return;
    entry.img = t.url; entry.pending = false; delete entry.drawErr;
    const list = loadAll();
    const i = list.findIndex(x => x.id && x.id === entry.id);
    if (i >= 0) { list[i].img = await shrink(t.url, 640); saveAll(list); }
    render(entry, false); renderHistory();
  };
  $("#again").onclick = () => write();
  $("#shot").onclick = () => savePage(entry);
  $("#vid").onclick = () => makeShorts(entry);
  el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}

function cellsOf(text, cols){
  const cells = [];
  String(text).trim().split(/\n+/).forEach(p => {
    Array.from(" " + p.trim()).forEach(ch => cells.push(ch));
    while (cells.length % cols) cells.push("");
  });
  while (cells.length < cols*6) cells.push("");
  return cells;
}
function loadImg(src){
  return new Promise(res => { if (!src) return res(null); const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
}

// 일기장 한 장을 캔버스에 직접 그립니다 (외부 라이브러리 없이 가볍게)
async function drawDiaryCanvas(entry){
  const W = 1080, PAD = 60, IW = W - PAD*2, COLS = 10, CELL = IW / COLS;
  const INK = "#23407F", GRID = "#9DB3D9", RED = "#E0483E", TEXT = "#2A2A2A";
  const HAND = '"PD Gaegu", "Gaegu", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  await ensureFonts(entry);
  const img = await loadImg(entry.img);
  const cells = cellsOf(entry.diary, COLS);
  const rows = cells.length / COLS;

  const META_H = 96, TITLE_H = 96;
  let picH = 0, dw = 0, dh = 0;
  if (img){
    const k = Math.min((IW - 40) / img.width, 760 / img.height);
    dw = img.width * k; dh = img.height * k; picH = dh + 40;
  }
  const gridH = rows * CELL;
  const H = PAD + META_H + picH + TITLE_H + gridH + 110;

  const c = document.createElement("canvas");
  c.width = W; c.height = Math.round(H);
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  g.textBaseline = "middle";
  let y = PAD;

  // 날짜 / 날씨
  const WX = W - PAD - 320;
  g.strokeStyle = INK; g.lineWidth = 4;
  g.strokeRect(PAD, y, IW, META_H);
  g.beginPath(); g.moveTo(WX, y); g.lineTo(WX, y + META_H); g.stroke();
  g.fillStyle = INK; g.font = `400 44px ${HAND}`; g.textAlign = "left";
  g.fillText(entry.date, PAD + 22, y + META_H/2 + 2);
  g.fillText("날씨: " + (WEATHER[entry.weather] || entry.weather || "☀️ 맑음"), WX + 22, y + META_H/2 + 2);
  y += META_H;

  // 그림
  if (img){
    g.strokeRect(PAD, y, IW, picH);
    g.drawImage(img, PAD + (IW - dw)/2, y + 20, dw, dh);
    y += picH;
  }

  // 제목
  g.strokeRect(PAD, y, IW, TITLE_H);
  g.font = `700 50px ${HAND}`; g.fillStyle = INK;
  g.fillText("제목: " + entry.title, PAD + 22, y + TITLE_H/2 + 2);
  y += TITLE_H;

  // 원고지
  const gy = y;
  g.lineWidth = 2; g.strokeStyle = GRID;
  for (let r = 1; r < rows; r++){ g.beginPath(); g.moveTo(PAD, gy + r*CELL); g.lineTo(PAD + IW, gy + r*CELL); g.stroke(); }
  for (let k = 1; k < COLS; k++){ g.beginPath(); g.moveTo(PAD + k*CELL, gy); g.lineTo(PAD + k*CELL, gy + gridH); g.stroke(); }
  g.lineWidth = 4; g.strokeStyle = INK; g.strokeRect(PAD, gy, IW, gridH);
  g.fillStyle = TEXT; g.font = `400 60px ${HAND}`; g.textAlign = "center";
  cells.forEach((ch, i) => {
    if (!ch || ch === " ") return;
    const cx = PAD + (i % COLS) * CELL + CELL/2, cy = gy + Math.floor(i / COLS) * CELL + CELL/2 + 3;
    g.fillText(ch, cx, cy);
  });
  y += gridH;

  // 참 잘했어요 도장
  g.save();
  g.translate(W - PAD - 70, y - 20);
  g.rotate(-14 * Math.PI / 180);
  g.globalAlpha = 0.9;
  g.fillStyle = "rgba(255,255,255,.6)";
  g.beginPath(); g.arc(0, 0, 105, 0, Math.PI*2); g.fill();
  g.strokeStyle = RED; g.lineWidth = 7;
  g.beginPath(); g.arc(0, 0, 105, 0, Math.PI*2); g.stroke();
  g.fillStyle = RED; g.font = `700 56px ${HAND}`; g.textAlign = "center";
  g.fillText("참", 0, -28); g.fillText("잘했어요", 0, 34);
  g.restore();

  // 서명
  g.globalAlpha = 1;
  g.fillStyle = "#6B7A99"; g.font = `400 36px ${HAND}`; g.textAlign = "left";
  g.fillText(`${entry.name}의 그림일기`, PAD, y + 70);
  return c;
}

function showShot(blob, entry){
  const dataUrl = URL.createObjectURL(blob);
  const fname = `petdiary-${new Date().toISOString().slice(0,10)}.jpg`;
  const box = document.createElement("div");
  box.className = "shotbox";
  box.innerHTML = `
    <div class="shotinner" role="dialog" aria-label="일기장 이미지">
      <p class="shottip">${IN_APP ? `카톡·인스타 안에서는 저장이 안 될 수 있어요.<br><button id="shotOut" class="outbtn">크롬으로 열어서 저장하기</button>` : `아래 이미지를 <b>꾹 눌러서</b><br>'이미지 저장'을 골라 주세요`}</p>
      <img src="${dataUrl}" alt="${escapeHtml(entry.name)}의 그림일기">
      <div class="shotbtns">
        <button id="shotShare">공유하기</button>
        <button id="shotDl">파일로 받기</button>
        <button id="shotClose">닫기</button>
      </div>
    </div>`;
  document.body.appendChild(box);
  document.body.style.overflow = "hidden";
  const close = () => { box.remove(); document.body.style.overflow = ""; URL.revokeObjectURL(dataUrl); };
  box.querySelector("#shotClose").onclick = close;
  const so = box.querySelector("#shotOut"); if (so) so.onclick = openExternal;
  box.addEventListener("click", e => { if (e.target === box) close(); });
  box.querySelector("#shotDl").onclick = () => {
    const a = document.createElement("a"); a.href = dataUrl; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
  };
  const sh = box.querySelector("#shotShare");
  sh.onclick = async () => {
    try {
      const file = new File([blob], fname, { type: "image/jpeg" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
      } else {
        sh.textContent = "이 브라우저는 공유가 안 돼요";

    } catch (e) {
      if (!e || e.name !== "AbortError") sh.textContent = "공유가 안 돼요. 꾹 눌러 저장해 주세요";
    }
  };
}

function shrink(dataUrl, max){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.8));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

async function drawPicture(entry, image){
  try {
    const resp = await fetch("/api/drawing", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ image, name: entry.name, kind: $("#kind").value, title: entry.title, diary: entry.diary, scene: entry.scene })
    });
    const r = await resp.json().catch(() => ({}));
    if (!resp.ok || !r.image) throw new Error(r.error || "그림을 그리다 멈췄어요.");
    entry.img = r.image; entry.drawn = true;
  } catch (e) {
    entry.drawErr = (e && e.message) || "그림을 그리다 멈췄어요.";
  }
  entry.pending = false;
  render(entry, false);
  delete entry.drawErr;
  const saved = Object.assign({}, entry, { img: entry.img ? await shrink(entry.img, 640) : null });
  const list = loadAll(); list.unshift(saved); saveAll(list);
  renderHistory();
}

  BR_EL: [4,2,0,0,2,1,1,2,3,3,2,4],
  // [월, 일, 지지] : 그 날짜부터 해당 월지 시작 (소한~대설)
  TERMS: [[1,6,1],[2,4,2],[3,6,3],[4,5,4],[5,6,5],[6,6,6],[7,7,7],[8,8,8],[9,8,9],[10,8,10],[11,7,11],[12,7,0]],

};
const md = (a, n) => ((a % n) + n) % n;
function jdn(y, m, d){
  const a = Math.floor((14 - m) / 12), y2 = y + 4800 - a, m2 = m + 12*a - 3;
  return d + Math.floor((153*m2 + 2)/5) + 365*y2 + Math.floor(y2/4) - Math.floor(y2/100) + Math.floor(y2/400) - 32045;
}
function sajuOf(dateStr){
  const [y, m, d] = dateStr.split("-").map(Number);
  const sy = (m < 2 || (m === 2 && d < 4)) ? y - 1 : y;
  const yi = md(sy - 4, 60);
  let mb = 0;
  for (const [tm, td, br] of SJ.TERMS) if (m > tm || (m === tm && d >= td)) mb = br;
  const ms = md((yi % 10) * 2 + 2 + md(mb - 2, 12), 10);
  const di = md(jdn(y, m, d) + 49, 60);
  const p = [
    { label:"년", s: yi % 10, b: yi % 12 },
    { label:"월", s: ms, b: mb },
    { label:"일", s: di % 10, b: di % 12 },
  ];
  const el = [0,0,0,0,0];
  p.forEach(x => { el[SJ.STEM_EL[x.s]]++; el[SJ.BR_EL[x.b]]++; });
  const ds = p[2].s;
  return {
    pillars: p,
    text: p.map(x => `${SJ.STEMS[x.s]}${SJ.BR[x.b]}(${SJ.STEMS_H[x.s]}${SJ.BR_H[x.b]})`).join(" "),
    elements: el,
    elText: SJ.EL.map((n,i) => `${n}${el[i]}`).join(" "),
    dayEl: SJ.STEM_EL[ds],
    dayMaster: `${SJ.STEMS[ds]}${SJ.EL[SJ.STEM_EL[ds]]} (${SJ.DM_DESC[ds]})`,
    animal: SJ.ANIMALS[p[0].b] + "띠",
    yearBranch: p[0].b,
  };
}
function elRel(a, b){ // a 기준 b와의 관계
  if (a === b) return "같은 기운";
  if (md(a + 1, 5) === b) return "내가 도와주는 사이";
  if (md(b + 1, 5) === a) return "나를 도와주는 사이";
  if (md(a + 2, 5) === b) return "내가 이기는 사이";
  return "나를 이기는 사이";
}
const HAP6 = [[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]];
const HAP3 = [[8,0,4],[11,3,7],[2,6,10],[5,9,1]];
function brRel(a, b){
  if (HAP6.some(([x,y]) => (x===a&&y===b)||(x===b&&y===a))) return { t:"육합(찰떡)", v:10 };
  if (a !== b && HAP3.some(g => g.includes(a) && g.includes(b))) return { t:"삼합(한 팀)", v:8 };
  if (md(a - b, 12) === 6) return { t:"충(티격태격)", v:-6 };
  if (a === b) return { t:"같은 띠", v:4 };
  return { t:"무난", v:0 };
}
function matchScore(pet, own, seed){
  let s = 74;
  const r = elRel(own.dayEl, pet.dayEl);
  if (r === "같은 기운") s += 6;
  else if (r.includes("도와")) s += 10;
  else s -= 4;
  const br = brRel(pet.yearBranch, own.yearBranch);
  s += br.v;
  const fill = SJ.EL.filter((_, i) => own.elements[i] === 0 && pet.elements[i] > 0);
  s += Math.min(fill.length * 3, 6);
  let h = 0; for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) % 997;
  s += (h % 7) - 3;
  s = Math.max(58, Math.min(99, s));
  const notes = `일간 관계: 집사 기준 반려동물과 ${r}. 띠 관계: ${br.t}.` + (fill.length ? ` 집사에게 없는 ${fill.join("·")} 기운을 반려동물이 채워 줌.` : "");
  return { score: s, notes };
}
function yearInfo(pet, year){
  const yi = md(year - 4, 60);
  const ys = yi % 10, yb = yi % 12;
  const yEl = SJ.STEM_EL[ys];
  const r = elRel(pet.dayEl, yEl);
  const br = brRel(pet.yearBranch, yb);
  return {
    pillar: `${SJ.STEMS[ys]}${SJ.BR[yb]}년(${SJ.STEMS_H[ys]}${SJ.BR_H[yb]}), ${SJ.EL[yEl]} 기운, ${SJ.ANIMALS[yb]}의 해`,
    notes: `반려동물 일간과 그해 기운: ${r}. 띠와 그해 띠: ${br.t}.`,
  };
}

    g.strokeStyle = "#E5602E"; g.fillStyle = "#FFB238";
    for (let i=0;i<10;i++){ const a=i*Math.PI/5; g.beginPath(); g.moveTo(Math.cos(a)*s*0.4,Math.sin(a)*s*0.4); g.lineTo(Math.cos(a)*s*0.62,Math.sin(a)*s*0.62); g.stroke(); }
    g.beginPath(); g.arc(0,0,s*0.34,0,Math.PI*2); g.fill(); g.stroke();
    g.fillStyle = "#E5602E"; g.beginPath(); g.arc(-s*0.1,-s*0.04,s*0.04,0,Math.PI*2); g.arc(s*0.1,-s*0.04,s*0.04,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(0,s*0.06,s*0.1,0.15*Math.PI,0.85*Math.PI); g.stroke();
  } else if (kind === "sprout"){
    g.strokeStyle = "#2E7D46"; g.fillStyle = "#6CC27A";
    g.beginPath(); g.moveTo(0,s*0.45); g.quadraticCurveTo(-s*0.05,0,0,-s*0.15); g.stroke();
    g.beginPath(); g.ellipse(-s*0.22,-s*0.25,s*0.24,s*0.12,-0.6,0,Math.PI*2); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(s*0.22,-s*0.3,s*0.24,s*0.12,0.6,0,Math.PI*2); g.fill(); g.stroke();
    g.fillStyle = "#A0673C"; g.strokeStyle = "#6E4425";
    g.beginPath(); g.moveTo(-s*0.3,s*0.3); g.lineTo(s*0.3,s*0.3); g.lineTo(s*0.22,s*0.62); g.lineTo(-s*0.22,s*0.62); g.closePath(); g.fill(); g.stroke();
  } else { // cushion
    g.fillStyle = "#D9534F"; g.strokeStyle = "#8E2C29";
    g.beginPath(); g.ellipse(0,0,s*0.62,s*0.26,0,0,Math.PI*2); g.fill(); g.stroke();
    g.fillStyle = "#F5C542";
    [[-0.6,0],[0.6,0]].forEach(([dx])=>{ g.beginPath(); g.arc(dx*s,0,s*0.07,0,Math.PI*2); g.fill(); });
    g.strokeStyle = "#F5C542"; g.lineWidth = s*0.04;
    g.beginPath(); g.ellipse(0,0,s*0.4,s*0.14,0,0,Math.PI*2); g.stroke();
  }
  g.restore();
}

// 귀여운 반려동물 캐릭터 (털 색, 종류에 맞게)
function drawPet(g, kind, fur, cx, cy, S, item){
  const c = FUR[fur] || FUR["치즈"];
  const OUT = "#3A2A1A";
  g.save(); g.lineJoin = "round"; g.lineCap = "round"; g.lineWidth = S*0.022; g.strokeStyle = OUT;
  const isDog = kind === "강아지", isRabbit = kind === "토끼", isHam = kind === "햄스터", isBird = kind === "새";
  const headR = S*0.3, hy = cy - S*0.12;

  if (isBird){
    g.fillStyle = c.base;
    g.beginPath(); g.ellipse(cx, cy, S*0.36, S*0.4, 0, 0, Math.PI*2); g.fill(); g.stroke();
    g.fillStyle = c.belly; g.beginPath(); g.ellipse(cx, cy+S*0.12, S*0.22, S*0.22, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = c.dark; g.beginPath(); g.ellipse(cx-S*0.3, cy+S*0.05, S*0.1, S*0.2, 0.4, 0, Math.PI*2); g.fill(); g.stroke();
    g.fillStyle = "#F2A541"; g.beginPath(); g.moveTo(cx-S*0.05,cy-S*0.12); g.lineTo(cx+S*0.05,cy-S*0.12); g.lineTo(cx,cy-S*0.04); g.closePath(); g.fill(); g.stroke();
    eyes(cx, cy-S*0.2, S*0.13, S*0.05);
    drawItem(g, item, cx+S*0.32, cy+S*0.28, S*0.32);
    g.restore(); return;
  }

  // 꼬리
  g.fillStyle = c.base;
  if (!isHam && !isRabbit){
    g.beginPath(); g.moveTo(cx+S*0.22, cy+S*0.32);
    g.bezierCurveTo(cx+S*0.6, cy+S*0.3, cx+S*0.55, cy-S*0.05, cx+S*0.42, cy-S*0.02);
    g.lineWidth = S*0.09; g.strokeStyle = OUT; g.stroke();
    g.lineWidth = S*0.06; g.strokeStyle = c.base; g.stroke();
    g.lineWidth = S*0.022; g.strokeStyle = OUT;
  }
  // 몸
  g.beginPath(); g.ellipse(cx, cy+S*0.25, S*0.27, S*0.23, 0, 0, Math.PI*2); g.fill(); g.stroke();
  g.fillStyle = c.pattern === "tuxedo" ? "#FAF7F0" : c.belly;
  g.beginPath(); g.ellipse(cx, cy+S*0.28, S*0.15, S*0.16, 0, 0, Math.PI*2); g.fill();

  // 귀
  g.fillStyle = c.base;
  if (isDog){
    [-1,1].forEach(sd => { g.beginPath(); g.ellipse(cx+sd*S*0.27, hy+S*0.02, S*0.09, S*0.18, sd*0.35, 0, Math.PI*2); g.fillStyle = c.dark; g.fill(); g.stroke(); });
  } else if (isRabbit){
    [-1,1].forEach(sd => { g.beginPath(); g.ellipse(cx+sd*S*0.11, hy-S*0.36, S*0.07, S*0.22, sd*0.12, 0, Math.PI*2); g.fillStyle = c.base; g.fill(); g.stroke();
      g.beginPath(); g.ellipse(cx+sd*S*0.11, hy-S*0.34, S*0.03, S*0.15, sd*0.12, 0, Math.PI*2); g.fillStyle = "#F4B6B6"; g.fill(); });
  } else if (isHam){
    [-1,1].forEach(sd => { g.beginPath(); g.arc(cx+sd*S*0.2, hy-S*0.22, S*0.07, 0, Math.PI*2); g.fillStyle = c.base; g.fill(); g.stroke(); });
  } else {
    [-1,1].forEach(sd => {
      g.beginPath(); g.moveTo(cx+sd*S*0.26, hy-S*0.08); g.lineTo(cx+sd*S*0.22, hy-S*0.36); g.lineTo(cx+sd*S*0.06, hy-S*0.24); g.closePath();
      g.fillStyle = (c.pattern === "calico" && sd < 0) ? c.patch : c.base; g.fill(); g.stroke();
      g.beginPath(); g.moveTo(cx+sd*S*0.22, hy-S*0.14); g.lineTo(cx+sd*S*0.205, hy-S*0.29); g.lineTo(cx+sd*S*0.11, hy-S*0.22); g.closePath();
      g.fillStyle = "#F4B6B6"; g.fill();
    });
  }
  // 머리
  g.fillStyle = c.base;
  g.beginPath(); g.ellipse(cx, hy, headR*(isHam?1.1:1), headR*0.88, 0, 0, Math.PI*2); g.fill(); g.stroke();
  // 무늬
  g.save(); g.beginPath(); g.ellipse(cx, hy, headR*(isHam?1.1:1), headR*0.88, 0, 0, Math.PI*2); g.clip();
  if (c.pattern === "stripe"){
    g.strokeStyle = c.dark; g.lineWidth = S*0.03;
    [-0.08,0,0.08].forEach(dx => { g.beginPath(); g.moveTo(cx+dx*S, hy-headR*0.85); g.lineTo(cx+dx*S*0.8, hy-headR*0.45); g.stroke(); });
    [-1,1].forEach(sd => { for (let k=0;k<2;k++){ g.beginPath(); g.moveTo(cx+sd*headR, hy+k*S*0.06-S*0.02); g.lineTo(cx+sd*headR*0.7, hy+k*S*0.05); g.stroke(); } });
  } else if (c.pattern === "calico"){
    g.fillStyle = c.patch; g.beginPath(); g.ellipse(cx-S*0.18, hy-S*0.12, S*0.16, S*0.13, 0.3, 0, Math.PI*2); g.fill();
    g.fillStyle = c.dark; g.beginPath(); g.ellipse(cx+S*0.2, hy-S*0.14, S*0.13, S*0.1, -0.3, 0, Math.PI*2); g.fill();
  } else if (c.pattern === "tuxedo"){
    g.fillStyle = "#FAF7F0"; g.beginPath(); g.moveTo(cx, hy-S*0.08); g.lineTo(cx-S*0.16, hy+S*0.3); g.lineTo(cx+S*0.16, hy+S*0.3); g.closePath(); g.fill();
  }
  g.restore();
  g.lineWidth = S*0.022; g.strokeStyle = OUT;
  // 주둥이
  if (isDog){ g.fillStyle = c.belly; g.beginPath(); g.ellipse(cx, hy+S*0.1, S*0.13, S*0.09, 0, 0, Math.PI*2); g.fill(); }
  eyes(cx, hy+S*0.0, S*0.11, S*0.045);
  // 볼터치
  g.fillStyle = "rgba(240,120,120,.45)";
  [-1,1].forEach(sd => { g.beginPath(); g.ellipse(cx+sd*S*0.17, hy+S*0.09, S*0.05, S*0.03, 0, 0, Math.PI*2); g.fill(); });
  // 코, 입
  g.fillStyle = isDog ? "#2A2220" : "#E58A9A";
  g.beginPath(); g.ellipse(cx, hy+S*0.065, S*(isDog?0.035:0.022), S*(isDog?0.025:0.016), 0, 0, Math.PI*2); g.fill();
  g.lineWidth = S*0.015; g.strokeStyle = (fur === "검정" || fur === "턱시도") && !isDog ? "#EDE6DA" : OUT;
  g.beginPath(); g.arc(cx-S*0.025, hy+S*0.09, S*0.025, 0.1*Math.PI, 0.9*Math.PI); g.arc(cx+S*0.025, hy+S*0.09, S*0.025, 0.1*Math.PI, 0.9*Math.PI); g.stroke();
  if (!isDog && !isRabbit && !isHam){ // 수염
    [-1,1].forEach(sd => { [-0.01,0.025].forEach(dy => { g.beginPath(); g.moveTo(cx+sd*S*0.13, hy+S*(0.07+dy)); g.lineTo(cx+sd*S*0.27, hy+S*(0.05+dy*1.6)); g.stroke(); }); });
  }
  // 앞발 + 들고 있는 물건
  drawItem(g, item, cx, cy+S*0.24, S*0.36);
  g.lineWidth = S*0.022; g.strokeStyle = OUT;
  g.fillStyle = c.pattern === "tuxedo" ? "#FAF7F0" : c.base;
  [-1,1].forEach(sd => { g.beginPath(); g.ellipse(cx+sd*S*0.13, cy+S*0.25, S*0.065, S*0.055, 0, 0, Math.PI*2); g.fill(); g.stroke(); });
  g.restore();

  function eyes(x, y, gap, r){
    [-1,1].forEach(sd => {
      g.fillStyle = (fur === "검정" || fur === "턱시도") && !isDog ? "#F2C94C" : "#2A2220";
      g.beginPath(); g.ellipse(x+sd*gap, y, r, r*1.15, 0, 0, Math.PI*2); g.fill();
      if ((fur === "검정" || fur === "턱시도") && !isDog){ g.fillStyle = "#2A2220"; g.beginPath(); g.ellipse(x+sd*gap, y, r*0.35, r*0.9, 0, 0, Math.PI*2); g.fill(); }
      g.fillStyle = "#fff"; g.beginPath(); g.arc(x+sd*gap-r*0.3, y-r*0.35, r*0.35, 0, Math.PI*2); g.fill();
    });
  }
}

async function drawCharmCanvas(c){
  const W = 1080, H = 1680, RED = "#C8321E";
  const SERIF = '"PD Batang", "Gowun Batang", "Noto Serif KR", "Noto Serif CJK KR", "Nanum Myeongjo", serif', SANS = '"PD Dodum", "Gowun Dodum", "Malgun Gothic", sans-serif', HAND = '"PD Gaegu", "Gaegu", sans-serif';
  await ensureFonts(c);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  // 부적 종이 (노란 한지 느낌)
  g.fillStyle = "#F1CE4A"; g.fillRect(0,0,W,H);
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  for (let i=0;i<2600;i++){ g.fillStyle = `rgba(${rnd()<.5?255:150},${rnd()<.5?230:120},40,${0.05+rnd()*0.08})`; g.fillRect(rnd()*W, rnd()*H, 2+rnd()*6, 1+rnd()*3); }
  // 테두리
  g.strokeStyle = RED; g.lineWidth = 14; g.strokeRect(40,40,W-80,H-80);
  g.lineWidth = 4; g.strokeRect(68,68,W-136,H-136);
  [[68,68],[W-68,68],[68,H-68],[W-68,H-68]].forEach(([x,y]) => { g.fillStyle = RED; g.beginPath(); g.arc(x,y,16,0,Math.PI*2); g.fill(); });

  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = RED; g.font = `400 40px ${SERIF}`; g.fillText("냥멍도사의 행운 부적", W/2, 140);
  g.font = `700 92px ${SERIF}`; g.fillText(c.r.charmName || CHARM_EL[c.need].name, W/2, 240);

  // 캐릭터 + 붉은 원
  const cy = 620;
  g.fillStyle = "rgba(255,248,224,.85)"; g.beginPath(); g.arc(W/2, cy, 290, 0, Math.PI*2); g.fill();
  g.strokeStyle = RED; g.lineWidth = 10; g.beginPath(); g.arc(W/2, cy, 290, 0, Math.PI*2); g.stroke();
  g.lineWidth = 3; g.beginPath(); g.arc(W/2, cy, 270, 0, Math.PI*2); g.stroke();
  const tall = c.kind === "토끼";
  drawPet(g, c.kind, c.fur, W/2, cy + (tall ? 55 : 10), tall ? 440 : 520, CHARM_EL[c.need].item);

  // 양옆 세로 한자
  const hanja = Array.from(c.hanja);
  g.fillStyle = RED; g.font = `700 110px ${SERIF}`;
  [[0,1,150],[2,3,W-150]].forEach(([a,b,x]) => {
    g.fillText(hanja[a] || "", x, cy-120); g.fillText(hanja[b] || "", x, cy+40);
  });
  g.font = `400 34px ${SANS}`; g.fillStyle = "#7A2A16";
  g.fillText(`${c.reading} · ${c.meaning}`, W/2, 975);

  // 이름 띠
  g.fillStyle = RED; g.fillRect(170, 1020, W-340, 90);
  g.fillStyle = "#FFF4D0"; g.font = `700 50px ${SERIF}`;
  g.fillText(`${c.name}에게 ${SJ.EL[c.need]}(${"木火土金水"[c.need]}) 기운 가득`, W/2, 1066);

  // 축복 문구
  g.fillStyle = "#3A2A1A"; g.font = `38px ${SANS}`; g.textAlign = "left";
  let y = 1180;
  wrapLines(g, c.r.blessing || "", W - 260).forEach(l => { g.fillText(l, 130, y); y += 56; });
  if (c.r.howTo){ y += 10; g.fillStyle = RED; g.font = `700 36px ${SANS}`; wrapLines(g, "📌 " + c.r.howTo, W - 260).forEach(l => { g.fillText(l, 130, y); y += 54; }); }

  // 도장
  g.save(); g.translate(W-210, H-200); g.rotate(-0.12);
  g.fillStyle = "rgba(200,50,30,.9)"; g.fillRect(-80,-80,160,160);
  g.fillStyle = "#F1CE4A"; g.font = `700 54px ${SERIF}`; g.textAlign = "center";
  g.fillText("냥멍", 0, -24); g.fillText("도사", 0, 38);
  g.restore();
  g.fillStyle = "#7A2A16"; g.font = `30px ${SANS}`; g.textAlign = "left";
  g.fillText(`${c.basis} ${c.date} · 재미로 보는 행운 부적`, 110, H-120);
  return cv;
}

async function askDosa(){
  const name = $("#sName").value.trim() || "우리 애";
  const kind = $("#sKind").value;
  const date = $("#sDate").value;
  const basis = $("#sNoBday").checked ? "집에 온 날" : "생일";
  if (sMode === "face" && !faceFile){ $("#sNote").textContent = "얼굴이 잘 보이는 사진을 골라 주세요."; return; }
  if (!date && sMode !== "face"){ $("#sNote").textContent = `${basis}을 넣어 주세요.`; return; }
  if (sajuUsed() >= SAJU_LIMIT){ $("#sNote").textContent = `오늘은 ${SAJU_LIMIT}번까지 볼 수 있어요. 내일 또 와 주세요!`; return; }
  const pet = date ? sajuOf(date) : null;
  const body = { mode: sMode, pet: pet ? { name, kind, basis, date, pillars: pet.text, dayMaster: pet.dayMaster, animal: pet.animal, elements: pet.elText } : { name, kind } };
  if (sMode === "face") body.image = await blobToBase64(faceFile);
  let need = null;
  if (sMode === "charm"){ need = needElement(pet); body.need = `${SJ.EL[need]}(${"木火土金水"[need]})`; body.fur = $("#sFur").value; }
  let own = null, score = null, yearSel = null, yinfo = null;
  if (sMode === "match"){
    const od = $("#oDate").value;
    if (!od){ $("#sNote").textContent = "집사 생일을 넣어 주세요."; return; }
    own = sajuOf(od);
    const ms = matchScore(pet, own, date + od);
    score = ms.score;
    Object.assign(body, { owner: { name: $("#oName").value.trim() || "집사", pillars: own.text, dayMaster: own.dayMaster, animal: own.animal, elements: own.elText }, score, notes: ms.notes });
  }
  if (sMode === "year"){
    yearSel = Number($("#sYear").value);
    yinfo = yearInfo(pet, yearSel);
    Object.assign(body, { year: yearSel, yearPillar: yinfo.pillar, notes: yinfo.notes });
  }

  $("#sNote").textContent = "";
  $("#sGo").disabled = true;
  const out = $("#sResult");
  out.innerHTML = `<p class="thinking">도사님이 ${escapeHtml(name)}의 기운을 읽는 중…</p>`;
  try {
    const resp = await fetch("/api/saju", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
    const r = await resp.json().catch(() => ({}));
    if (!resp.ok || r.error) throw new Error(r.error || "도사님이 잠깐 자리를 비웠어요. 다시 눌러 주세요.");
    sajuMark();
    const card = { mode: sMode, need, fur: $("#sFur").value, name, kind, basis, date, pet, photo: sMode === "face" ? faceThumb : null, own, ownerName: body.owner && body.owner.name, score, year: yearSel, yinfo, r };
    await renderSaju(card);
  } catch (e) {
    out.innerHTML = "";
    $("#sNote").textContent = (e && e.message) || "다시 눌러 주세요.";
  } finally {
    $("#sGo").disabled = false;
  }
}

function sajuSections(c){
  const r = c.r;
  if (c.mode === "pet") return [["타고난 성격", r.personality], ["잘 맞는 간식", r.snacks], ["좋아할 놀이", r.toys], ["살짝 조심", r.caution], ["행운의 아이템", r.lucky]];
  if (c.mode === "face") return [["눈", r.eyes], ["코와 입", r.nose], ["귀", r.ears], ["털 색과 무늬", r.fur], ["전생 직업", r.pastLife], ["타고난 복", r.fortune], ["관상 + 사주 종합", r.combo]];
  if (c.mode === "match") return [["전생에 둘은", r.pastLife], ["찰떡인 점", r.good], ["티격태격 포인트", r.careful], ["더 친해지는 팁", r.tip]];
  return [["봄", r.spring], ["여름", r.summer], ["가을", r.autumn], ["겨울", r.winter], ["행운의 아이템", r.lucky], ["살짝 조심", r.caution]];
}
function sajuHead(c){
  if (c.mode === "pet") return { small: "냥멍도사의 사주풀이", big: `${c.name}${c.r.nickname ? ` · ${c.r.nickname}` : ""}` };
  if (c.mode === "face") return { small: "냥멍도사의 관상풀이", big: `${c.name}${c.r.nickname ? ` · ${c.r.nickname}` : ""}` };
  if (c.mode === "match") return { small: "냥멍도사의 궁합풀이", big: `${c.ownerName} ♥ ${c.name}` };
  return { small: `냥멍도사의 ${c.year}년 운세`, big: `${c.name}${c.r.keyword ? ` · ${c.r.keyword}` : ""}` };
}

  const hz = String(c.r.hanja || "").replace(/[^\u4E00-\u9FFF]/g, "");
  c.hanja = hz.length === 4 ? hz : fb.hanja;

// ===== 사주 카드 이미지 =====
function wrapLines(g, text, maxW){
  // 띄어쓰기 단위로 줄을 바꿔요. 한 단어가 너무 길 때만 글자 단위로 끊어요.
  const lines = []; let cur = "";
  for (const word of String(text).split(/\s+/).filter(Boolean)){
    const t = cur ? cur + " " + word : word;
    if (g.measureText(t).width <= maxW){ cur = t; continue; }
    if (cur) lines.push(cur);
    if (g.measureText(word).width <= maxW){ cur = word; continue; }
    cur = "";
    for (const ch of Array.from(word)){
      if (g.measureText(cur + ch).width > maxW && cur){ lines.push(cur); cur = ch; } else cur += ch;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}
async function drawSajuCanvas(c){
  const W = 1080, PAD = 70, IW = W - PAD*2;
  const RED = "#C8321E", INK = "#3A2A1A", BROWN = "#8A5A3A";
  const SERIF = '"PD Batang", "Gowun Batang", "Nanum Myeongjo", serif', HAND = '"PD Gaegu", "Gaegu", sans-serif', SANS = '"PD Dodum", "Gowun Dodum", "Malgun Gothic", sans-serif';
  await ensureFonts(c);
  const h = sajuHead(c), secs = sajuSections(c).filter(x => x[1]);

  // 높이 계산용 임시 캔버스
  const m = document.createElement("canvas").getContext("2d");
  m.font = `38px ${SANS}`;
  const secLines = secs.map(([t,p]) => wrapLines(m, p, IW));
  m.font = `700 40px ${SANS}`;
  const sumLines = wrapLines(m, c.r.summary || "", IW);
  const PILL_H = c.mode === "match" ? 260 : c.mode === "face" ? (300 + (c.pet ? 230 : 0)) : 230;
  let H = PAD + 70 + 80 + (c.mode === "match" ? 130 : 0) + (c.mode === "year" ? 50 : 0) + PILL_H + (c.mode === "match" || c.mode === "face" ? 0 : 80)
        + sumLines.length * 54 + 30 + secLines.reduce((a, l) => a + 70 + l.length * 54 + 16, 0) + 150;

  const cv = document.createElement("canvas"); cv.width = W; cv.height = Math.round(H);
  const g = cv.getContext("2d");
  g.fillStyle = "#FBEFC4"; g.fillRect(0, 0, W, H);
  g.strokeStyle = RED; g.lineWidth = 6; g.strokeRect(24, 24, W - 48, H - 48);
  g.lineWidth = 2; g.strokeRect(38, 38, W - 76, H - 76);
  g.textBaseline = "middle"; g.textAlign = "center";
  let y = PAD + 20;

  g.fillStyle = RED; g.font = `400 36px ${SERIF}`;
  g.fillText(h.small, W/2, y); y += 70;
  g.font = `700 64px ${SERIF}`;
  g.fillText(h.big, W/2, y); y += 80;

  if (c.mode === "match"){ g.font = `700 140px ${HAND}`; g.fillText(`${c.score}점`, W/2, y + 50); y += 130; }
  if (c.mode === "year"){ g.fillStyle = BROWN; g.font = `30px ${SANS}`; g.fillText(c.yinfo.pillar, W/2, y); y += 50; }

  const drawPills = (sj, x0, w, withHour, label) => {
    const items = sj.pillars.map(p => [p.label, SJ.STEMS_H[p.s], SJ.BR_H[p.b], SJ.STEMS[p.s] + SJ.BR[p.b]]);
    if (withHour) items.unshift(["시", "?", "?", "모름"]);
    let yy = y;
    if (label){ g.fillStyle = RED; g.font = `700 34px ${SERIF}`; g.fillText(label, x0 + w/2, yy + 10); yy += 44; }
    const gap = 10, bw = (w - gap*(items.length-1)) / items.length, bh = label ? 190 : 210;
    items.forEach((it, i) => {
      const bx = x0 + i*(bw+gap);
      g.fillStyle = "#FFF8E0"; g.fillRect(bx, yy, bw, bh);
      g.strokeStyle = RED; g.lineWidth = 3; g.strokeRect(bx, yy, bw, bh);
      g.fillStyle = BROWN; g.font = `26px ${SANS}`; g.fillText(it[0], bx + bw/2, yy + 24);
      g.fillStyle = INK; g.font = `700 ${label ? 50 : 58}px ${SERIF}`;
      g.fillText(it[1], bx + bw/2, yy + (label ? 70 : 78)); g.fillText(it[2], bx + bw/2, yy + (label ? 126 : 142));
      g.fillStyle = BROWN; g.font = `24px ${SANS}`; g.fillText(it[3], bx + bw/2, yy + bh - 20);
    });
  };
  if (c.mode === "face"){
    const ph = await loadImg(c.photo);
    if (ph){
      const R = 130, cx = W/2, cy = y + 140, side = Math.min(ph.width, ph.height);
      g.save(); g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.clip();
      g.drawImage(ph, (ph.width-side)/2, (ph.height-side)/2, side, side, cx-R, cy-R, R*2, R*2);
      g.restore();
      g.strokeStyle = RED; g.lineWidth = 8; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.stroke();
    }
    y += 300;
    if (c.pet){ drawPills(c.pet, PAD, IW, false); y += 230; }
  } else if (c.mode === "match"){
    const half = (IW - 30) / 2;
    drawPills(c.own, PAD, half, false, c.ownerName);
    drawPills(c.pet, PAD + half + 30, half, false, c.name);
    y += PILL_H;
  } else {
    drawPills(c.pet, PAD, IW, false);
    y += PILL_H;
    const total = c.pet.elements.reduce((a,b)=>a+b,0) || 1;
    let bx = PAD;
    c.pet.elements.forEach((n, i) => { if (!n) return; const w = IW * n / total; g.fillStyle = SJ.EL_COLOR[i]; g.fillRect(bx, y, w, 22); bx += w; });
    g.font = `28px ${SANS}`;
    SJ.EL.forEach((n, i) => { g.fillStyle = SJ.EL_COLOR[i]; g.fillText(`${n} ${c.pet.elements[i]}`, PAD + IW*(i+0.5)/5, y + 52); });
    y += 80;
  }

  g.fillStyle = INK; g.font = `700 40px ${SANS}`;
  sumLines.forEach(l => { g.fillText(l, W/2, y + 20); y += 54; });
  y += 30;

  secs.forEach(([t], i) => {
    g.strokeStyle = RED; g.setLineDash([10, 8]); g.lineWidth = 2;
    g.beginPath(); g.moveTo(PAD, y); g.lineTo(W - PAD, y); g.stroke(); g.setLineDash([]);
    g.textAlign = "left";
    g.fillStyle = RED; g.font = `700 38px ${SERIF}`; g.fillText(t, PAD, y + 40);
    y += 70;
    g.fillStyle = INK; g.font = `38px ${SANS}`;
    secLines[i].forEach(l => { g.fillText(l, PAD, y + 20); y += 54; });
    y += 16;
  });

  g.textAlign = "center"; g.fillStyle = BROWN; g.font = `28px ${SANS}`;
  g.fillText(`${c.date ? `${c.basis} ${c.date} 기준 · ` : ""}재미로 보는 운세예요`, W/2, y + 30);
  return cv;
}

function photoPicker(inputSel, dropSel, hintSel, onPick){
  $(inputSel).addEventListener("change", async e => {

    const t = await makeThumb(f); if (!t || !t.blob) { $("#xNote").textContent = "이 사진은 읽을 수 없어요."; return; }

    onPick(t);

async function postExtra(body){
  const resp = await fetch("/api/extra", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
  const r = await resp.json().catch(() => ({}));
  if (!resp.ok || r.error) throw new Error(r.error || "잠깐 문제가 생겼어요. 다시 눌러 주세요.");
  return r;
}

async function drawChatCanvas(c){
  const W = 1080, PAD = 50, SANS = '"PD Dodum", "Gowun Dodum", "Malgun Gothic", sans-serif', HAND = '"PD Gaegu", "Gaegu", sans-serif', SERIF = '"PD Batang", "Gowun Batang", serif';
  await ensureFonts(c);
  const img = await loadImg(c.photo);
  const m = document.createElement("canvas").getContext("2d");
  m.font = `38px ${SANS}`;
  const BW = 640, LH = 52;
  const msgs = c.r.chat.map(x => ({ ...x, lines: wrapLines(m, x.text, BW - 56) }));
  m.font = `40px ${HAND}`;
  const dA = wrapLines(m, c.r.diaryA || "", W - PAD*2 - 80), dB = wrapLines(m, c.r.diaryB || "", W - PAD*2 - 80);
  const photoH = img ? 520 : 0;
  let H = 60 + photoH + 130;
  msgs.forEach((x, i) => { H += x.lines.length*LH + 40 + ((i === 0 || msgs[i-1].who !== x.who) ? 40 : 6); });
  H += 60 + (dA.length + dB.length)*54 + 260;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = Math.round(H);
  const g = cv.getContext("2d");
  g.fillStyle = "#BACEE0"; g.fillRect(0, 0, W, H);
  let y = 40;
  if (img){
    const k = Math.max((W - PAD*2) / img.width, photoH / img.height), sw = (W - PAD*2)/k, sh = photoH/k;
    g.save(); g.beginPath(); g.roundRect(PAD, y, W - PAD*2, photoH, 28); g.clip();
    g.drawImage(img, (img.width - sw)/2, (img.height - sh)/2, sw, sh, PAD, y, W - PAD*2, photoH); g.restore();
    y += photoH + 20;
  }
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "#1F3B5A"; g.font = `700 50px ${SERIF}`;
  g.fillText(c.r.title || `${c.a.name}와 ${c.b.name}의 대화`, W/2, y + 50);
  y += 110;
  const avatar = (x, yy, who) => {
    const p = who === "A" ? c.a : c.b;
    g.fillStyle = who === "A" ? "#F2A54A" : "#8FC7A8"; g.beginPath(); g.roundRect(x, yy, 76, 76, 26); g.fill();
    g.fillStyle = "#fff"; g.font = `700 38px ${SANS}`; g.textAlign = "center"; g.fillText(Array.from(p.name)[0] || "?", x + 38, yy + 40);
  };
  msgs.forEach((x, i) => {
    const first = i === 0 || msgs[i-1].who !== x.who;
    const isA = x.who === "A", p = isA ? c.a : c.b;
    g.font = `38px ${SANS}`;
    const tw = Math.max(...x.lines.map(l => g.measureText(l).width)) + 56, bh = x.lines.length*LH + 28;
    if (first){
      y += 14;
      if (isA){ avatar(PAD, y, "A"); g.textAlign = "left"; g.fillStyle = "#3A4A5A"; g.font = `30px ${SANS}`; g.fillText(p.name, PAD + 96, y + 16); }
      else { g.textAlign = "right"; g.fillStyle = "#3A4A5A"; g.font = `30px ${SANS}`; g.fillText(p.name, W - PAD - 96, y + 16); avatar(W - PAD - 76, y, "B"); }
      y += 36;
    }
    const bx = isA ? PAD + 96 : W - PAD - 96 - tw;
    g.fillStyle = isA ? "#FFFFFF" : "#FEE500";
    g.beginPath(); g.roundRect(bx, y, tw, bh, 26); g.fill();
    g.fillStyle = "#222"; g.font = `38px ${SANS}`; g.textAlign = "left";
    x.lines.forEach((l, k) => g.fillText(l, bx + 28, y + 14 + LH/2 + k*LH));
    y += bh + 12;
  });
  y += 40;
  // 서로에 대한 일기
  [[c.a, dA, "#F2A54A"], [c.b, dB, "#8FC7A8"]].forEach(([p, lines, col]) => {
    const h = 80 + lines.length*54 + 20;
    g.fillStyle = "#FFFDF7"; g.beginPath(); g.roundRect(PAD, y, W - PAD*2, h, 22); g.fill();
    g.fillStyle = col; g.fillRect(PAD, y + 22, 10, h - 44);
    g.textAlign = "left"; g.fillStyle = "#333"; g.font = `700 36px ${SANS}`; g.fillText(`${p.name}의 일기`, PAD + 40, y + 46);
    g.font = `40px ${HAND}`; g.fillStyle = "#3A3A3A";
    lines.forEach((l, k) => g.fillText(l, PAD + 40, y + 100 + k*54));
    y += h + 20;
  });
  return cv;
}

async function drawLetterCanvas(c){
  const W = 1080, PAD = 90, IW = W - PAD*2;
  const HAND = '"PD Gaegu", "Gaegu", "Apple SD Gothic Neo", sans-serif', SERIF = '"PD Batang", "Gowun Batang", "Noto Serif KR", serif', SANS = '"PD Dodum", "Gowun Dodum", sans-serif';
  await ensureFonts(c);
  const m = document.createElement("canvas").getContext("2d");
  m.font = `400 46px ${HAND}`;
  const paras = String(c.r.letter).split(/\n+/).map(p => p.trim()).filter(Boolean);
  const lines = []; paras.forEach((p, i) => { wrapLines(m, p, IW - 80).forEach(l => lines.push(l)); if (i < paras.length - 1) lines.push(""); });
  const LH = 74, photoY = 330, paperTop = 650;
  m.font = `400 36px ${HAND}`;
  const psLines = c.r.ps ? wrapLines(m, "추신. " + c.r.ps, IW - 80).slice(0, 3) : [];
  const footH = 50 + (c.theme === "party" && c.occasion ? 58 : 0) + 20 + psLines.length * 50 + 40;
  const H = paperTop + 60 + lines.length * LH + footH + 70;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  const party = c.theme === "party";
  const T = party ? { a:"#FFF1D6", b:"#FFE6EC", c:"#FFF8EE", accent:"#D94F70", ring:"#F3B2C1", text:"#4A2E36", line:"#F6DDE3", sub:"#9A6B78" }
                  : { a:"#E7DDFB", b:"#DDEBFB", c:"#FBEFF4", accent:"#5B4A99", ring:"#C9B8EE", text:"#3A3350", line:"#E6DCF7", sub:"#7A6E99" };
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, T.a); bg.addColorStop(0.45, T.b); bg.addColorStop(1, T.c);
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  if (party){
    // 가랜드 깃발
    const flags = ["#F6B3B3","#F8CF9F","#F6E7A1","#BFE3B4","#AED3F2","#C9B8EE"];
    g.strokeStyle = "#C9A27A"; g.lineWidth = 3; g.beginPath(); g.moveTo(0, 60); g.quadraticCurveTo(W/2, 150, W, 60); g.stroke();
    for (let i = 0; i < 12; i++){
      const t = (i + 0.5) / 12, x = t*W, y = 60 + 90*4*t*(1-t) * 1;
      g.fillStyle = flags[i % flags.length]; g.beginPath(); g.moveTo(x-30, y); g.lineTo(x+30, y); g.lineTo(x, y+62); g.closePath(); g.fill();
    }
    // 색종이
    let sd = 3; const rr = () => (sd = (sd*16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 70; i++){ g.save(); g.translate(rr()*W, 150 + rr()*290); g.rotate(rr()*Math.PI); g.fillStyle = flags[i % flags.length]; g.fillRect(-8, -4, 16, 8); g.restore(); }
  } else {
    // 무지개
    ["#F6B3B3","#F8CF9F","#F6E7A1","#BFE3B4","#AED3F2","#C9B8EE"].forEach((col, i) => {
      g.strokeStyle = col; g.globalAlpha = 0.7; g.lineWidth = 26;
      g.beginPath(); g.arc(W/2, 560, 470 - i*26, Math.PI*1.08, Math.PI*1.92); g.stroke();
    });
    g.globalAlpha = 1;
  }
  // 구름
  const cloud = (x, y, s) => { g.fillStyle = "rgba(255,255,255,.92)"; [[0,0,1],[0.8,-0.3,0.8],[1.6,0,0.9],[0.8,0.25,0.9]].forEach(([dx,dy,r]) => { g.beginPath(); g.arc(x+dx*s, y+dy*s, r*s, 0, Math.PI*2); g.fill(); }); };
  if (!party){ cloud(110, 470, 46); cloud(W-230, 450, 52); cloud(W/2-80, 170, 30); }
  // 반짝이
  if (!party) g.fillStyle = "#FFFFFF"; else g.fillStyle = "#FFD36B"; [[200,240],[880,220],[160,400],[930,430]].concat(party ? [] : [[540,90]]).forEach(([x,y]) => { g.beginPath(); for (let k=0;k<8;k++){ const r = k%2 ? 5 : 14, a = k*Math.PI/4; g.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r); } g.closePath(); g.fill(); });
  // 사진 또는 발바닥
  const R = 150, img = await loadImg(c.photo);
  g.fillStyle = "#fff"; g.beginPath(); g.arc(W/2, photoY, R+14, 0, Math.PI*2); g.fill();
  if (img){
    const side = Math.min(img.width, img.height);
    g.save(); g.beginPath(); g.arc(W/2, photoY, R, 0, Math.PI*2); g.clip();
    g.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, W/2-R, photoY-R, R*2, R*2); g.restore();
  } else {
    g.fillStyle = T.ring;
    g.beginPath(); g.ellipse(W/2, photoY+30, 60, 48, 0, 0, Math.PI*2); g.fill();
    [[-70,-30],[-28,-75],[28,-75],[70,-30]].forEach(([dx,dy]) => { g.beginPath(); g.ellipse(W/2+dx, photoY+dy, 24, 30, 0, 0, Math.PI*2); g.fill(); });
  }
  g.strokeStyle = T.ring; g.lineWidth = 5; g.beginPath(); g.arc(W/2, photoY, R+14, 0, Math.PI*2); g.stroke();
  // 제목
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = T.accent; g.font = `700 54px ${SERIF}`;
  g.fillText(c.r.title || `${c.name}가 보내는 편지`, W/2, 560);
  // 편지지
  const ph = 60 + lines.length * LH + footH;
  g.fillStyle = "rgba(255,253,247,.96)";
  g.beginPath(); g.roundRect(PAD-10, paperTop, IW+20, ph, 28); g.fill();
  g.strokeStyle = T.line; g.lineWidth = 2;
  for (let i = 0; i <= lines.length; i++){ const ly = paperTop + 50 + (i+1)*LH - 14; g.beginPath(); g.moveTo(PAD+30, ly); g.lineTo(PAD+IW-30, ly); g.stroke(); }
  g.textAlign = "left"; g.fillStyle = T.text; g.font = `400 46px ${HAND}`;
  lines.forEach((l, i) => g.fillText(l, PAD+40, paperTop + 50 + i*LH + LH/2));
  let y = paperTop + 50 + lines.length*LH + 30;
  if (party && c.occasion){ g.textAlign = "right"; g.font = `700 32px ${SANS}`; g.fillStyle = T.accent; g.fillText(`♥ ${c.occasion}에`, PAD+IW-30, y); y += 58; }
  g.textAlign = "right"; g.font = `700 44px ${HAND}`; g.fillStyle = T.accent;
  g.fillText(c.r.closing || (party ? `${c.name}가` : `무지개다리 너머에서, ${c.name}`), PAD+IW-30, y);
  y += 20;
  if (psLines.length){ y += 50; g.textAlign = "left"; g.font = `400 36px ${HAND}`; g.fillStyle = T.sub; psLines.forEach(l => { g.fillText(l, PAD+40, y); y += 50; }); }
  return cv;
}

function canvasBlob(cv){ return new Promise(r => cv.toBlob(r, "image/jpeg", 0.9)); }
function loadJSZip(){
  if (window.JSZip) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function downloadZip(pages, base){

    const blob = await zip.generateAsync({ type: "blob" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${base}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    btn.textContent = "받았어요";
  } catch (e) { console.error(e); btn.textContent = "ZIP이 안 돼요. 한 장씩 저장해 주세요"; }

}

const CAL = { W: 1600, H: 1200, INK: "#23407F", RED: "#D9472B", BLUE: "#2F5FA8", GRID: "#C9D6EC", PAPER: "#FFFDF7" };
function calBase(g){
  g.fillStyle = CAL.PAPER; g.fillRect(0, 0, CAL.W, CAL.H);
  for (let x = 120; x < CAL.W - 80; x += 92){ // 스프링
    g.fillStyle = "#E7E2D6"; g.beginPath(); g.arc(x, 44, 14, 0, Math.PI*2); g.fill();
    g.strokeStyle = "#9AA3B5"; g.lineWidth = 6; g.beginPath(); g.arc(x, 30, 16, Math.PI*0.15, Math.PI*0.85, true); g.stroke();
  }
}
function drawFit(g, img, x, y, w, h){
  if (!img) return;
  const k = Math.min(w / img.width, h / img.height), dw = img.width * k, dh = img.height * k;
  g.drawImage(img, x + (w - dw)/2, y + (h - dh)/2, dw, dh);
}
function smallPaw(g, x, y, s, col){
  g.fillStyle = col;
  g.beginPath(); g.ellipse(x, y + s*0.25, s*0.42, s*0.34, 0, 0, Math.PI*2); g.fill();
  [[-0.42,-0.2],[-0.15,-0.48],[0.15,-0.48],[0.42,-0.2]].forEach(([dx,dy]) => { g.beginPath(); g.ellipse(x+dx*s, y+dy*s, s*0.15, s*0.19, 0, 0, Math.PI*2); g.fill(); });
}
async function drawCalCover(name, year, src){
  const HAND = '"PD Gaegu", "Gaegu", sans-serif', SANS = '"PD Dodum", "Gowun Dodum", sans-serif';
  await ensureFonts(name);
  const cv = document.createElement("canvas"); cv.width = CAL.W; cv.height = CAL.H; const g = cv.getContext("2d");

function pickVideoType(){

function musicBox(ctx, dest, seconds){
  // 저작권 걱정 없는 직접 만든 오르골 멜로디
  const tune = [72,76,79,81,79,76,74,72, 74,77,81,79,77,74,72,71, 72,76,79,84,83,79,76,74, 72,74,76,79,76,74,72,null];
  const beat = 0.42, start = ctx.currentTime + 0.15;
  const master = ctx.createGain(); master.gain.value = 0.16; master.connect(dest);
  for (let i = 0; i * beat < seconds - 0.5; i++){
    const n = tune[i % tune.length]; if (n == null) continue;
    const t = start + i * beat, f = 440 * Math.pow(2, (n - 69) / 12);
    [[1, 0.9], [2, 0.25], [3, 0.08]].forEach(([mul, vol]) => {
      const o = ctx.createOscillator(), gg = ctx.createGain();
      o.type = "sine"; o.frequency.value = f * mul;
      gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(vol, t + 0.01); gg.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
      o.connect(gg); gg.connect(master); o.start(t); o.stop(t + 1.7);
    });
  }
  master.gain.setValueAtTime(0.16, start + seconds - 1.6); master.gain.linearRampToValueAtTime(0.0001, start + seconds - 0.2);
}

  let fs = 58, lines = [], lh = 0;
  for (; fs >= 38; fs -= 2){
    g.font = `400 ${fs}px ${HAND}`; lines = wrapLines(g, entry.diary, 900); lh = Math.round(fs * 1.45);
    if (lines.length * lh <= TEXT_BOTTOM - TEXT_TOP) break;
  }
  const T_TITLE = 0.5, T_TEXT = 1.6, PER_LINE = 1.0;
  const T_STAMP = T_TEXT + lines.length * PER_LINE + 0.4, DURATION = T_STAMP + 2.6;
  const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const dots = Array.from({ length: 40 }, () => [rnd() * W, rnd() * H, 2 + rnd() * 4, rnd() * Math.PI * 2]);

  function frame(t){
    // 배경
    const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#EAF1FB"); bg.addColorStop(1, "#FDF3F6");
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    dots.forEach(([x, y, r, p]) => { g.fillStyle = `rgba(255,255,255,${0.5 + 0.4 * Math.sin(t * 1.5 + p)})`; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); });
    g.textBaseline = "middle"; g.textAlign = "center";
    // 날짜·날씨
    const a0 = ease(t / 0.6);
    g.globalAlpha = a0; g.fillStyle = "#fff"; g.beginPath(); g.roundRect(W/2 - 330, 110, 660, 76, 38); g.fill();
    g.fillStyle = INK; g.font = `400 40px ${HAND}`;
    g.fillText(`${entry.date}  ·  ${WEATHER[entry.weather] || entry.weather || "☀️ 맑음"}`, W/2, 150);
    // 제목
    const a1 = ease((t - T_TITLE) / 0.7);
    g.globalAlpha = a1; g.font = `700 80px ${HAND}`;
    const title = entry.title, tw = g.measureText(title).width;
    g.fillStyle = "#FFE45C"; g.beginPath(); g.roundRect(W/2 - tw/2 - 18, 278 - 30 * a1 + 30, tw + 36, 34, 17); g.fill();
    g.fillStyle = INK; g.fillText(title, W/2, 262 + (1 - a1) * 30);
    g.globalAlpha = 1;
    // 그림 (천천히 확대)
    const FX = 90, FY = 360, FS = 900, FH = 800;
    const a2 = ease(t / 0.9);
    g.globalAlpha = a2;
    g.save(); g.shadowColor = "rgba(35,64,127,.18)"; g.shadowBlur = 30; g.shadowOffsetY = 10;
    g.fillStyle = "#fff"; g.beginPath(); g.roundRect(FX - 18, FY - 18, FS + 36, FH + 36, 36); g.fill(); g.restore();
    if (img){
      g.save(); g.beginPath(); g.roundRect(FX, FY, FS, FH, 24); g.clip();
      const zoom = 1 + 0.08 * (t / DURATION);
      const k = Math.max(FS / img.width, FH / img.height) * zoom, dw = img.width * k, dh = img.height * k;
      g.drawImage(img, FX + (FS - dw) / 2, FY + (FH - dh) / 2, dw, dh);
      g.restore();
    }
    g.globalAlpha = 1;
    // 일기 글 (한 줄씩 써지듯이)
    g.textAlign = "left"; g.font = `400 ${fs}px ${HAND}`;
    lines.forEach((line, i) => {
      const st = T_TEXT + i * PER_LINE; if (t < st) return;
      const chars = Array.from(line), shown = Math.min(chars.length, Math.floor((t - st) / (PER_LINE * 0.85) * chars.length) + 1);
      const ly = TEXT_TOP + i * lh + lh / 2;
      g.strokeStyle = "rgba(157,179,217,.55)"; g.lineWidth = 2; g.beginPath(); g.moveTo(80, ly + lh * 0.42); g.lineTo(W - 80, ly + lh * 0.42); g.stroke();
      g.fillStyle = "#333"; g.fillText(chars.slice(0, shown).join(""), 90, ly);
    });
    // 참 잘했어요 도장
    if (t >= T_STAMP){
      const p = Math.min((t - T_STAMP) / 0.35, 1), sc = p < 1 ? 1.6 - 0.6 * ease(p) : 1;
      g.save(); g.translate(W - 210, FY + FH - 40); g.rotate(-0.25); g.scale(sc, sc); g.globalAlpha = Math.min(1, p * 1.5);
      g.fillStyle = "rgba(255,255,255,.75)"; g.beginPath(); g.arc(0, 0, 120, 0, Math.PI * 2); g.fill();
      g.strokeStyle = RED; g.lineWidth = 9; g.beginPath(); g.arc(0, 0, 120, 0, Math.PI * 2); g.stroke();
      g.fillStyle = RED; g.textAlign = "center"; g.font = `700 64px ${HAND}`; g.fillText("참", 0, -34); g.fillText("잘했어요", 0, 40);
      g.restore(); g.globalAlpha = 1;
    }
    // 끝 서명
    const a3 = ease((t - T_STAMP - 0.6) / 0.6);
    if (a3 > 0){ g.globalAlpha = a3; g.textAlign = "center"; g.fillStyle = INK; g.font = `700 46px ${HAND}`; g.fillText(`${entry.name}의 그림일기`, W/2, H - 70); g.globalAlpha = 1; }
  }

  // 녹화
  const type = pickVideoType();
  const stream = cv.captureStream(FPS);
  let actx = null;
  if ($("#vidMusic") && $("#vidMusic").checked){
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const dest = actx.createMediaStreamDestination();
      musicBox(actx, dest, DURATION);
      dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
    } catch (e) { console.warn(e); }
  }
  const rec = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 6_000_000 } : { videoBitsPerSecond: 6_000_000 });
  const chunks = []; rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const done = new Promise(res => rec.onstop = res);
  frame(0); rec.start(250);
  const t0 = performance.now();
  out.innerHTML = `<p class="thinking">영상 녹화 중… 약 ${Math.ceil(DURATION)}초 걸려요. 화면을 끄거나 다른 앱으로 가지 말아 주세요.</p>`;
  await new Promise(res => {
    const tick = () => {
      const t = (performance.now() - t0) / 1000;
      frame(Math.min(t, DURATION));
      btn.textContent = `녹화 중 ${Math.min(100, Math.round(t / DURATION * 100))}%`;
      if (t < DURATION) requestAnimationFrame(tick); else res();
    };
    requestAnimationFrame(tick);
  });
  rec.stop(); await done;
  if (actx) try { actx.close(); } catch {}
  const mime = (rec.mimeType || type || "video/webm").split(";")[0];
  const ext = mime.includes("mp4") ? "mp4" : "webm";
  const blob = new Blob(chunks, { type: mime });
  const url = URL.createObjectURL(blob);
  const fname = `petdiary-shorts-${new Date().toISOString().slice(0,10)}.${ext}`;
  out.innerHTML = `<div class="vidwrap"><video src="${url}" controls playsinline></video></div>
    <div class="actions"><button id="vidSave" class="main">영상 저장하기</button><button id="vidShare">공유하기</button></div>
    ${ext === "webm" ? `<p class="disclaimer" style="color:var(--muted)">이 휴대폰에서는 webm 형식으로 만들어졌어요. 유튜브는 그대로 올라가고, 인스타에 올릴 땐 캡컷에서 한 번 불러와 저장하면 돼요.</p>` : ""}`;
  $("#vidSave").onclick = () => { const a = document.createElement("a"); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); };
  $("#vidShare").onclick = async () => {
    try { const f = new File([blob], fname, { type: mime }); if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f] }); else $("#vidShare").textContent = "공유가 안 돼요. 저장해 주세요"; }
    catch (e) { if (!e || e.name !== "AbortError") $("#vidShare").textContent = "공유가 안 돼요. 저장해 주세요"; }
  };
  btn.disabled = false; btn.textContent = "🎬 쇼츠 영상 다시 만들기";
}
</script>
</body>
</html>
